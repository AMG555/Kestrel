name: "cloudmapper"
command: "cloudmapper"
enabled: true
short_description: "AWS network visualisation and security analysis tool"
description: |
  CloudMapper is an AWS network visualisation and security analysis tool.

  **Main features:**
  - AWS network visualisation
  - Security analysis
  - Network mapping
  - Admin finder

  **Use cases:**
  - AWS network analysis
  - Security assessment
  - Network visualisation
  - Security auditing
parameters:
  - name: "action"
    type: "string"
    description: "Action to perform (collect, prepare, webserver, find_admins, etc.)"
    required: false
    default: "collect"
    position: 0
    format: "positional"
  - name: "account"
    type: "string"
    description: "AWS account to analyse"
    required: false
    flag: "--account"
    format: "flag"
  - name: "config"
    type: "string"
    description: "Configuration file path"
    required: false
    flag: "--config"
    format: "flag"
    default: "config.json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional cloudmapper arguments. Used to pass cloudmapper options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples based on tool characteristics

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure parameter format is correct to avoid command injection
      - This argument is appended directly to the end of the command
    required: false
    format: "positional"
