name: "radare2"
command: "r2"
enabled: true
short_description: "Binary analysis and reverse engineering framework with disassembly, debugging, and scripting support"
description: |
  Radare2 is a complete binary analysis and reverse engineering framework supporting multiple architectures and file formats.

  **Key Features:**
  - Disassembly and decompilation: supports multiple architectures (x86, ARM, MIPS, etc.)
  - Debugging: local and remote debugging
  - Scripting: r2pipe scripts and r2 command scripts
  - Multiple file formats: ELF, PE, Mach-O, firmware, etc.
  - Interactive analysis: CLI and visual mode
  - Automated analysis: batch and scripted analysis

  **Use Cases:**
  - Binary file analysis
  - Reverse engineering and vulnerability research
  - Malware analysis
  - CTF reverse engineering challenges
  - Firmware analysis
  - Exploit development

  **Notes:**
  - Use -c to execute commands and exit (non-interactive mode)
  - Use -i to execute a script file
  - Use -q for quiet mode (suppress startup output)
  - Use -A to auto-analyze a binary
  - Use -d to attach to a process for debugging
parameters:
  - name: "target"
    type: "string"
    description: |
      Target file, process ID, or special value.

      **Format:**
      - File path: "/path/to/binary"
      - Process ID: "1234" (combine with -d flag)
      - Special values: "-" (read from stdin), "--" (interactive mode), "=" (read from environment variable)

      **Example Values:**
      - Binary file: "/tmp/vulnerable"
      - Process debugging: "1234" (with -d)
      - From stdin: "-"

      **Notes:**
      - Required parameter, cannot be empty
      - If a process ID is specified, -d flag must also be used
      - Note: radare2 requires the file path to be the last argument, so target uses position 1
    required: true
    position: 1
    format: "positional"
  - name: "commands"
    type: "string"
    description: |
      Radare2 command(s) to execute. Can be a single command or multiple commands separated by semicolons.

      **Format:**
      - Single command: "aaa" (auto-analyze)
      - Multiple commands: "aaa; pdf @main; VV" (analyze, disassemble main, visualize)

      **Common commands:**
      - "aaa": auto-analyze all functions
      - "afl": list all functions
      - "pdf @main": disassemble the main function
      - "px 64": display 64 bytes in hex
      - "VV": enter visual mode
      - "i": show file information
      - "iz": show strings

      **Example Values:**
      - "aaa" (auto-analyze)
      - "aaa; pdf @main" (analyze and disassemble main)
      - "i; iz" (show file info and strings)

      **Notes:**
      - Multiple commands are separated by semicolons (;)
      - The program exits after executing commands (non-interactive mode)
    required: false
    flag: "-c"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: |
      Path to a script file. The script contains Radare2 commands, one per line.

      **Format:**
      - Script file path: "/path/to/script.r2"

      **Example Values:**
      - "/tmp/analyze.r2"
      - "./scripts/auto_analyze.r2"

      **Notes:**
      - Commands in the script are executed in order
      - The program exits after the script completes
    required: false
    flag: "-i"
    format: "flag"
  - name: "arch"
    type: "string"
    description: |
      Specify the target architecture.

      **Common architectures:**
      - "x86": 32-bit x86
      - "x86_64": 64-bit x86
      - "arm": ARM architecture
      - "arm64": ARM64 architecture
      - "mips": MIPS architecture
      - "ppc": PowerPC architecture

      **Example Values:**
      - "x86"
      - "x86_64"
      - "arm"
      - "arm64"

      **Notes:**
      - If not specified, radare2 attempts auto-detection
      - Some architectures may require additional configuration
    required: false
    flag: "-a"
    format: "flag"
  - name: "bits"
    type: "int"
    description: |
      Specify the target bit width (16, 32, 64).

      **Example Values:**
      - 16 (16-bit)
      - 32 (32-bit)
      - 64 (64-bit)

      **Notes:**
      - Typically used together with -a
      - If not specified, radare2 attempts auto-detection
    required: false
    flag: "-b"
    format: "flag"
  - name: "auto_analyze"
    type: "bool"
    description: |
      Auto-analyze the binary. Equivalent to running the "aaa" command.

      **Use Cases:**
      - Quickly analyze a binary
      - Batch analysis

      **Notes:**
      - When enabled, all functions are automatically analyzed
      - May take a long time
    required: false
    flag: "-A"
    format: "flag"
    default: false
  - name: "debug"
    type: "bool"
    description: |
      Debug mode. Can attach to a process or debug a file.

      **Use Cases:**
      - Attach to a running process
      - Debug a binary

      **Notes:**
      - Requires appropriate permissions
      - Required when target is a process ID
    required: false
    flag: "-d"
    format: "flag"
    default: false
  - name: "quiet"
    type: "bool"
    description: |
      Quiet mode. Suppresses startup messages and prompts.

      **Use Cases:**
      - Scripted usage
      - Batch analysis
      - Automated tool invocation

      **Notes:**
      - Suitable for non-interactive use
      - Reduces output noise
    required: false
    flag: "-q"
    format: "flag"
    default: false
  - name: "seek"
    type: "string"
    description: |
      Set the starting address. Can be a hex address or expression.

      **Format:**
      - Hex: "0x400000"
      - Expression: "main+0x10"

      **Example Values:**
      - "0x400000"
      - "main"
      - "0x1000"

      **Notes:**
      - Address can be hex or a symbol name
      - Used to start analysis from a specific location
    required: false
    flag: "-s"
    format: "flag"
  - name: "base_address"
    type: "string"
    description: |
      Set the base address for loading.

      **Format:**
      - Hex address: "0x400000"

      **Example Values:**
      - "0x400000"
      - "0x1000000"

      **Notes:**
      - Used to specify the load address of a binary
      - Typically used when analyzing firmware or memory dumps
    required: false
    flag: "-B"
    format: "flag"
  - name: "eval"
    type: "string"
    description: |
      Set configuration variables in key=value format.

      **Format:**
      - "key=value"
      - Separate multiple variables with spaces: "asm.arch=x86 asm.bits=32"

      **Example Values:**
      - "asm.arch=x86"
      - "asm.bits=32"
      - "scr.color=false"

      **Notes:**
      - Used to set radare2 configuration variables
      - Separate multiple variables with spaces
    required: false
    flag: "-e"
    format: "flag"
  - name: "project"
    type: "string"
    description: |
      Load or save a project file.

      **Format:**
      - Project file path: "/path/to/project.r2"

      **Example Values:**
      - "./project.r2"
      - "/tmp/analysis.r2"

      **Notes:**
      - Project files save analysis state and configuration
      - Can be used to restore a previous analysis session
    required: false
    flag: "-p"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra radare2 arguments. Used to pass options not defined in the parameter list.

      **Available options:**
      - "-C": force color output
      - "-f": force open file (even if format does not match)
      - "-L": list supported plugins
      - "-M": enable write mode
      - "-n": do not load config file
      - "-N": do not execute scripts
      - "-S": start in sandbox mode
      - "-t": use threaded mode
      - "-u": use unicorn engine
      - "-v": show version information
      - "-w": write mode
      - "-z": scan strings
      - "-X": execute r2pipe script
      - "-P patch": apply patch
      - "-m maddr": map address

      **Example Values:**
      - "-w" (write mode)
      - "-n" (do not load config file)
      - "-M" (enable write mode)
      - "-z" (scan strings)

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure correct parameter format to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
