name: "linpeas"
command: "linpeas.sh"
enabled: true
short_description: "Linux privilege escalation enumeration script for detecting common escalation paths"
description: |
  LinPEAS (Linux Privilege Escalation Awesome Script) is an automated privilege escalation enumeration script for detecting common escalation paths on Linux systems.

  **Key Features:**
  - System information collection
  - Permissions and group checks
  - Writable file and directory detection
  - SUID/SGID file search
  - Environment variable checks
  - Cron job analysis
  - Network configuration checks
  - Sensitive file discovery

  **Use Cases:**
  - Privilege escalation in penetration testing
  - Security auditing
  - Post-exploitation
  - CTF competitions

  **Notes:**
  - Requires linpeas.sh to be downloaded on the target system
  - Execution may take a long time
  - Output is verbose; saving to a file is recommended
parameters:
  - name: "output"
    type: "string"
    description: "Output file path (optional)"
    required: false
    flag: "-o"
    format: "flag"
  - name: "fast"
    type: "bool"
    description: "Fast mode, skip time-consuming checks"
    required: false
    flag: "-fast"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra linpeas arguments. Used to pass options not defined in the parameter list.

      **Example Values:**
      - Add commonly used parameter examples based on tool characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure correct parameter format to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
