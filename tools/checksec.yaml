name: "checksec"
command: "checksec"
enabled: true
short_description: "Binary security feature checker"
description: |
  Checksec is a tool for checking the security features of binary files.

  **Main features:**
  - Security feature checks
  - Protection mechanism detection
  - Supports multiple architectures
  - Detailed reports

  **Use cases:**
  - Binary security analysis
  - Protection mechanism checks
  - Vulnerability research
  - Security assessment
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to check"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional checksec arguments. Used to pass checksec options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples based on tool characteristics

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure parameter format is correct to avoid command injection
      - This argument is appended directly to the end of the command
    required: false
    format: "positional"
