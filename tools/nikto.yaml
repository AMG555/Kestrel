name: "nikto"
command: "nikto"
enabled: true
# Allowed exit codes: nikto returns exit code 1 when vulnerabilities are found, which is a normal success state
allowed_exit_codes: [1]
# Short description (used in tool list to reduce token consumption)
short_description: "Web server scanner for detecting known vulnerabilities and misconfigurations in web servers and applications"
# Detailed tool description
description: |
  Web server scanner for detecting known vulnerabilities, misconfigurations, and potential security issues in web servers and applications.

  **Key Features:**
  - Detect web server version and configuration issues
  - Identify known web vulnerabilities and CVEs
  - Detect dangerous files and directories
  - Check server misconfigurations
  - Identify outdated software versions
  - Detect default files and scripts

  **Use Cases:**
  - Web application security assessment
  - Server configuration auditing
  - Vulnerability scanning and discovery
  - Pre-engagement information gathering

  **Notes:**
  - Scans may generate large amounts of logs; manage logs appropriately
  - Some scans may trigger WAF or IDS alerts
  - Use within authorized scope only
  - Scan results require manual verification
# Parameter definitions
parameters:
  - name: "target"
    type: "string"
    description: |
      Target URL or IP address. Can be a full URL or IP address.

      **Format requirements:**
      - May include protocol (http:// or https://)
      - Can be just an IP address or domain name
      - If only an IP is provided, http is used by default

      **Example Values:**
      - Full URL: "http://example.com"
      - HTTPS: "https://example.com"
      - IP address: "192.168.1.1"
      - With port: "http://example.com:8080"
      - With path: "http://example.com/admin"

      **Notes:**
      - If only an IP is provided, the tool will use http
      - Providing the full URL is recommended for accurate scanning
      - Required parameter, cannot be empty
    required: true
    flag: "-h"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra nikto arguments. Used to pass options not defined in the parameter list.

      **Example Values:**
      - Add commonly used parameter examples based on tool characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure correct parameter format to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
