name: "ropgadget"
command: "ROPgadget"
enabled: true
short_description: "ROP gadget search tool"
description: |
  ROPgadget is a tool for searching ROP gadgets in binary files.

  **Key Features:**
  - ROP gadget search
  - Multiple architecture support
  - Gadget classification
  - Exploit chain generation

  **Use Cases:**
  - Binary analysis
  - Exploit development
  - ROP chain construction
  - Security research
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Extra ropgadget arguments. Used to pass options not defined in the parameter list.

      **Example Values:**
      - Add commonly used parameter examples based on tool characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure correct parameter format to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
