name: "hydra"
command: "hydra"
args: ["-I"]
enabled: true
short_description: "Password brute-force tool supporting multiple protocols and services"
description: |
  Hydra is a network login password brute-force tool supporting SSH, FTP, HTTP, SMB, and many more protocols.

  **Calling conventions (required reading):**
  - Must provide a **username**: at least one of `username` (-l) or `username_file` (-L)
  - Must provide a **password**: at least one of `password` (-p), `password_file` (-P), or `-C` (via `additional_args`)
  - **Always start with a small wordlist** (tens to hundreds of entries) to confirm the target is reachable before scaling up; do not default to large wordlists like rockyou
  - Defaults enabled: stop on first match (-f), 4 parallel threads (-t), ignore restore (-I); for long-running tasks, set `output_file`

  **CLI order:** `hydra [options] <target> <service>` (arguments are assembled in this order; do not place target before options)

  **Use Cases:** Weak password detection and password strength assessment in authorized environments

  **Note:** For authorized targets only; reduce `wait_time` or use a smaller wordlist for unresponsive targets to avoid long hangs.
parameters:
  - name: "username"
    type: "string"
    description: "Single username (-l); at least one of username or username_file is required"
    required: false
    flag: "-l"
    format: "flag"
  - name: "username_file"
    type: "string"
    description: "Username wordlist file (-L)"
    required: false
    flag: "-L"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Single password (-p)"
    required: false
    flag: "-p"
    format: "flag"
  - name: "password_file"
    type: "string"
    description: "Password wordlist file (-P); prefer a small wordlist for initial tests"
    required: false
    flag: "-P"
    format: "flag"
  - name: "stop_on_first"
    type: "bool"
    description: "Stop immediately after finding a valid credential pair (-f, default true)"
    required: false
    flag: "-f"
    format: "flag"
    default: true
  - name: "tasks"
    type: "int"
    description: "Parallel connections per target (-t); 4 is recommended for SSH, default 4"
    required: false
    flag: "-t"
    format: "flag"
    default: 4
  - name: "wait_time"
    type: "int"
    description: "Seconds to wait for a response per connection (-w), default 16 (lower than Hydra's default 32, reduces hang time)"
    required: false
    flag: "-w"
    format: "flag"
    default: 16
  - name: "wait_between"
    type: "int"
    description: "Seconds between connections per thread (-W), default 1"
    required: false
    flag: "-W"
    format: "flag"
    default: 1
  - name: "output_file"
    type: "string"
    description: "Write results to file (-o); recommended for long-running tasks"
    required: false
    flag: "-o"
    format: "flag"
  - name: "target"
    type: "string"
    description: "Target IP, hostname, or CIDR (must follow options)"
    required: true
    position: 1
    format: "positional"
  - name: "service"
    type: "string"
    description: "Service type (ssh, ftp, http-get, http-post-form, smb, etc. — see hydra -h)"
    required: true
    position: 2
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Extra arguments (e.g. -s port, -S for SSL, -m module options, -C login:pass file), appended at the end of the command"
    required: false
    format: "positional"
