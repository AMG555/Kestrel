name: "objdump"
command: "objdump"
enabled: true
short_description: "Binary file disassembly tool"
description: |
  Objdump is part of GNU binutils and is used to disassemble binary files.

  **Key Features:**
  - Disassembly
  - Symbol table display
  - Section information display
  - Multiple architecture support

  **Use Cases:**
  - Binary analysis
  - Reverse engineering
  - Program understanding
  - Debug assistance
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "disassemble"
    type: "bool"
    description: "Disassemble the binary"
    required: false
    flag: "-d"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Extra objdump arguments. Used to pass options not defined in the parameter list.

      **Example Values:**
      - Add commonly used parameter examples based on tool characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure correct parameter format to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
