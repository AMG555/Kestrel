name: "kube-bench"
command: "kube-bench"
enabled: true
short_description: "CIS Kubernetes Benchmark check tool"
description: |
  Kube-bench is a CIS Kubernetes Benchmark check tool that verifies whether a Kubernetes cluster complies with the CIS benchmark.

  **Key Features:**
  - CIS benchmark checks
  - Multiple target support (master, node, etcd, policies)
  - Detailed reports
  - Configuration validation

  **Use Cases:**
  - Kubernetes compliance checking
  - Security configuration auditing
  - CIS benchmark validation
  - Security assessment
parameters:
  - name: "targets"
    type: "string"
    description: "Targets to check (master, node, etcd, policies)"
    required: false
    flag: "--targets"
    format: "flag"
  - name: "version"
    type: "string"
    description: "Kubernetes version"
    required: false
    flag: "--version"
    format: "flag"
  - name: "config_dir"
    type: "string"
    description: "Configuration directory"
    required: false
    flag: "--config-dir"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, yaml)"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Extra kube-bench arguments. Used to pass options not defined in the parameter list.

      **Example Values:**
      - Add commonly used parameter examples based on tool characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure correct parameter format to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
