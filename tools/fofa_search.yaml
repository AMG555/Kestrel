name: "fofa_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import base64
    import requests
    import os

    # ==================== FOFA configuration ====================
    # Configure your FOFA API Key here
    # You can also set it in the environment variable: FOFA_API_KEY
    # enabled defaults to false; must be enabled to call this MCP
    FOFA_API_KEY = ""  # Fill in your FOFA API key
    # ==================================================

    # FOFA API base URL
    base_url = "https://fofa.info/api/v1/search/all"

    # Parse arguments (from JSON string or command-line args)
    def parse_args():
        # Try to read JSON config from the first argument
        if len(sys.argv) > 1:
            try:
                # Ensure sys.argv[1] is a string
                arg1 = str(sys.argv[1])
                # Try to parse as JSON
                config = json.loads(arg1)
                # Ensure the result is a dict
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
                # Not JSON; fall through to positional argument mode
                pass

        # Traditional positional argument mode (backward compatible)
        # Note: api_key is not passed as a call argument; it comes from config or env var
        # Argument positions: query=2, size=3, page=4, fields=5, full=6
        # In sys.argv, due to `python3 -c "code"` format, actual positions need adjustment
        # sys.argv[0] is '-c'; actual arguments start at sys.argv[1]
        config = {}
        if len(sys.argv) > 1:
            config['query'] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config['size'] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 3:
            try:
                config['page'] = int(sys.argv[3])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 4:
            config['fields'] = str(sys.argv[4])
        if len(sys.argv) > 5:
            val = sys.argv[5]
            if isinstance(val, str):
                config['full'] = val.lower() in ('true', '1', 'yes')
            else:
                config['full'] = bool(val)
        return config

    try:
        config = parse_args()

        # Ensure config is a dict
        if not isinstance(config, dict):
            error_result = {
                "status": "error",
                "message": f"Argument parsing error: expected dict but got {type(config).__name__}",
                "type": "TypeError"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # Get api_key from config or environment variable
        api_key = os.getenv('FOFA_API_KEY', FOFA_API_KEY).strip()
        query = config.get('query', '').strip()

        if not api_key:
            error_result = {
                "status": "error",
                "message": "Missing FOFA configuration: api_key (FOFA API key)",
                "required_config": ["api_key"],
                "note": "Set your API key in the FOFA_API_KEY field in the YAML file, or in the FOFA_API_KEY environment variable. API keys are available from the FOFA user centre: https://fofa.info/userInfo"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not query:
            error_result = {
                "status": "error",
                "message": "Missing required parameter: query (search query expression)",
                "required_params": ["query"],
                "examples": [
                    'app="Apache"',
                    'title="login"',
                    'domain="example.com"',
                    'ip="1.1.1.1"',
                    'port="80"',
                    'country="CN"',
                    'city="Beijing"'
                ]
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # Build request parameters
        params = {
            'key': api_key,
            'qbase64': base64.b64encode(query.encode('utf-8')).decode('utf-8')
        }

        # Optional parameters
        if 'size' in config and config['size'] is not None:
            try:
                size = int(config['size'])
                if size > 0:
                    params['size'] = size
            except (ValueError, TypeError):
                pass

        if 'page' in config and config['page'] is not None:
            try:
                page = int(config['page'])
                if page > 0:
                    params['page'] = page
            except (ValueError, TypeError):
                pass

        if 'fields' in config and config['fields']:
            params['fields'] = str(config['fields']).strip()

        if 'full' in config and config['full'] is not None:
            full_val = config['full']
            if isinstance(full_val, bool):
                params['full'] = 'true' if full_val else 'false'
            elif isinstance(full_val, str):
                params['full'] = 'true' if full_val.lower() in ('true', '1', 'yes') else 'false'
            elif isinstance(full_val, (int, float)):
                params['full'] = 'true' if full_val != 0 else 'false'

        # Send request
        try:
            response = requests.get(base_url, params=params, timeout=30)
            response.raise_for_status()

            result_data = response.json()

            # Check for FOFA API errors
            if result_data.get('error'):
                error_result = {
                    "status": "error",
                    "message": f"FOFA API error: {result_data.get('errmsg', 'unknown error')}",
                    "error_code": result_data.get('error'),
                    "suggestion": "Check that the API key is correct and that the query conforms to FOFA syntax"
                }
                print(json.dumps(error_result, ensure_ascii=False, indent=2))
                sys.exit(1)

            # Format output
            output = {
                "status": "success",
                "query": query,
                "size": result_data.get('size', 0),
                "page": result_data.get('page', 1),
                "total": result_data.get('total', 0),
                "results_count": len(result_data.get('results', [])),
                "results": result_data.get('results', []),
                "message": f"Successfully retrieved {len(result_data.get('results', []))} results"
            }

            print(json.dumps(output, ensure_ascii=False, indent=2))

        except requests.exceptions.RequestException as e:
            error_result = {
                "status": "error",
                "message": f"Request failed: {str(e)}",
                "suggestion": "Check network connectivity or FOFA API service status"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

    except Exception as e:
        error_result = {
            "status": "error",
            "message": f"Execution error: {str(e)}",
            "type": type(e).__name__
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
enabled: false
short_description: "FOFA cyberspace search engine with flexible query parameter configuration"
description: |
  FOFA is a cyberspace mapping search engine that allows searching for internet assets using various query conditions.

  **Main features:**
  - Supports multiple query syntaxes (app, title, domain, ip, port, country, city, etc.)
  - Flexible field return configuration
  - Paginated query support
  - Full data mode (full parameter)

  **Use cases:**
  - Asset discovery and enumeration
  - Vulnerability impact scope assessment
  - Security situational awareness
  - Threat intelligence gathering
  - Bug bounty information collection

  **Query syntax overview:**

  **Basic queries:**
  - Enter a query expression directly; searches across title, HTML content, HTTP headers, and URL fields
  - When a query expression has multiple AND/OR relationships, wrap it in parentheses, e.g.: `(app="Apache" || app="Nginx") && country="CN"`

  **Logical operators:**
  - `=` — match; with `=""`, queries for fields that don't exist or have empty values
  - `==` — exact match; with `==""`, queries for fields that exist with empty values
  - `&&` — AND
  - `||` — OR
  - `!=` — not match; with `!=""`, queries for fields with non-empty values
  - `*=` — fuzzy match using `*` or `?`
  - `()` — defines query priority; content inside parentheses has the highest priority

  **Common query syntax categories:**

  **Basic:** `ip` (supports IPv4/IPv6/CIDR), `port`, `domain`, `host`, `os`, `server`, `asn`, `org`, `is_domain`, `is_ipv6`

  **Tags:** `app` (application identification), `fid` (site fingerprint), `product`, `product.version`, `category`, `type` (service/subdomain), `cloud_name`, `is_cloud`, `is_fraud`, `is_honeypot`

  **Protocol (type=service):** `protocol`, `banner`, `banner_hash`, `banner_fid`, `base_protocol` (tcp/udp)

  **Website (type=subdomain):** `title`, `header`, `header_hash`, `body`, `body_hash`, `js_name`, `js_md5`, `cname`, `cname_domain`, `icon_hash`, `status_code`, `icp`, `sdk_hash`

  **Geolocation:** `country` (supports codes or names), `region` (supports English/Chinese names; Chinese limited to China), `city`

  **Certificate:** `cert`, `cert.subject`, `cert.issuer`, `cert.subject.org`, `cert.subject.cn`, `cert.issuer.org`, `cert.issuer.cn`, `cert.domain`, `cert.is_equal`, `cert.is_valid`, `cert.is_match`, `cert.is_expired`, `jarm`, `tls.version`, `tls.ja3s`, `cert.sn`, `cert.not_after.after/before`, `cert.not_before.after/before`

  **Time:** `after` (updated after date), `before` (updated before date)

  **Standalone IP syntax (cannot be combined with other syntax):** `port_size`, `port_size_gt`, `port_size_lt`, `ip_ports`, `ip_country`, `ip_region`, `ip_city`, `ip_after`, `ip_before`

  **Common query examples:**
  - `app="Apache"` — search for Apache assets
  - `title="login"` — search for pages with "login" in the title
  - `domain="example.com"` — search for a specific domain
  - `ip="1.1.1.1"` or `ip="220.181.111.1/24"` — search by IP or CIDR
  - `port="80"` — search for assets with port 80 open
  - `country="CN"` or `country="China"` — search for assets in China
  - `city="Beijing"` — search for assets in Beijing
  - `app="Apache" && country="CN"` — combined query
  - `(app="Apache" || app="Nginx") && country="CN"` — complex query with parentheses
  - `title*="login"` — fuzzy match on title
  - `after="2023-01-01" && before="2023-12-01"` — time range query

  **Full syntax documentation:** See the official FOFA documentation for more syntax details and component lists.

  **Notes:**
  - API calls have rate limits; use responsibly
  - Number of query results is limited by account permissions
  - The full parameter requires elevated permissions
parameters:
  - name: "query"
    type: "string"
    description: |
      FOFA query expression (required).

      Search query expression supporting FOFA query syntax.
      Examples:
      - app="Apache"
      - title="login"
      - domain="example.com"
      - ip="1.1.1.1"
      - port="80"
      - country="CN"
      - app="Apache" && country="CN"
    required: true
    position: 2
    format: "positional"
  - name: "size"
    type: "int"
    description: |
      Number of results to return (optional).

      Results per page; default 100.
      Range: 1-10000, limited by account permissions.
    required: false
    position: 3
    format: "positional"
    default: 100
  - name: "page"
    type: "int"
    description: |
      Page number (optional).

      Page to return, starting from 1; default 1.
      Used for paginating through large result sets.
    required: false
    position: 4
    format: "positional"
    default: 1
  - name: "fields"
    type: "string"
    description: |
      List of fields to return (optional).

      Fields to include in the response; multiple fields separated by commas.
      Default fields: ip,port,domain
      Available fields: host,title,ip,domain,port,protocol,country,province,city,server,icp,header,banner,body,as_number,as_organization
    required: false
    position: 5
    format: "positional"
    default: "ip,port,domain"
  - name: "full"
    type: "bool"
    description: |
      Whether to return full data (optional).

      When set to true, returns complete data; requires elevated permissions.
      Default false; returns basic data.
    required: false
    position: 6
    format: "positional"
    default: false
