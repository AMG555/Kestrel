name: "sqlmap"
command: "sqlmap"
enabled: true
# Short description (used in tool list to reduce token consumption)
short_description: "Automated SQL injection detection and exploitation tool"
# Detailed tool description
description: |
  Automated SQL injection detection and exploitation tool for discovering and exploiting SQL injection vulnerabilities.

  **Key Features:**
  - Automatic SQL injection vulnerability detection
  - Multiple database type support (MySQL, PostgreSQL, Oracle, MSSQL, etc.)
  - Automatic database information extraction (tables, columns, data)
  - Multiple injection technique support (boolean-based blind, time-based blind, UNION query, etc.)
  - Advanced features: file upload/download, command execution, etc.

  **Use Cases:**
  - Web application security testing
  - SQL injection vulnerability detection
  - Database information gathering
  - Penetration testing and vulnerability verification

  **Notes:**
  - For authorized security testing only
  - Some operations may impact the target system
  - Validate in a test environment first
  - Use --batch to avoid interactive prompts
# Parameter definitions
parameters:
  - name: "url"
    type: "string"
    description: |
      Target URL containing parameters that may be vulnerable to SQL injection.

      **Format requirements:**
      - Full URL including protocol (http:// or https://)
      - Must include query parameters; use * to mark injection points
      - Or provide a full URL and sqlmap will detect parameters automatically

      **Example Values:**
      - Mark injection point: "http://example.com/page?id=1*"
      - Full URL: "http://example.com/page?id=1"
      - POST data: "http://example.com/login" (combine with data parameter)
      - Cookie injection: "http://example.com/page" (combine with cookie parameter)

      **Notes:**
      - URL must be reachable
      - Ensure correct URL format including protocol prefix
      - For POST requests, combine with the data parameter
      - Required parameter, cannot be empty
    required: true
    flag: "-u"
    format: "flag"
  - name: "batch"
    type: "bool"
    description: |
      Non-interactive mode, automatically selects defaults without user input.

      **Use Cases:**
      - Automated test scripts
      - Batch scanning
      - Avoid interactive prompts

      **Notes:**
      - Recommended: always set to true to prevent tool from waiting for input
      - Default value is true
    required: false
    default: true
    flag: "--batch"
    format: "flag"
  - name: "level"
    type: "int"
    description: |
      Test level, range 1-5. Higher levels are more thorough but take longer.

      **Level descriptions:**
      - Level 1: Basic tests, fast but may miss some vulnerabilities
      - Level 2: Default level, balances speed and coverage
      - Level 3: Extended tests, more comprehensive detection
      - Level 4: Deep tests, includes more payloads
      - Level 5: Most comprehensive tests, includes all known techniques

      **Recommendations:**
      - Fast scans: use 1-2
      - Standard tests: use 3 (default)
      - Deep tests: use 4-5

      **Notes:**
      - Higher levels generate more requests and may trigger WAF blocking
      - Default value is 3
    required: false
    default: 3
    flag: "--level"
    format: "combined" # --level=3
  - name: "data"
    type: "string"
    description: |
      POST data string for SQL injection detection in POST requests.

      **Format:**
      - Form data format, e.g.: "username=admin&password=123"
      - JSON format, e.g.: {"username":"admin","password":"123"}

      **Notes:**
      - Required when the URL uses POST method
      - Mark injection points in parameter values with *
    required: false
    flag: "--data"
    format: "flag"
  - name: "cookie"
    type: "string"
    description: |
      Cookie string for Cookie injection detection.

      **Format:**
      - Standard Cookie format, e.g.: "sessionid=abc123; user=admin"

      **Notes:**
      - Required when testing Cookie injection
    required: false
    flag: "--cookie"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra SQLMap arguments. Used to pass options not defined in the parameter list.

      **Example Values:**
      - "--dbs": List all databases
      - "--tables -D database": List tables in specified database
      - "--dump -D database -T table": Dump table data
      - "--os-shell": Get an OS shell
      - "--risk 2": Risk level (1-3)
      - "--threads 10": Concurrent thread count
      - "--tamper space2comment": Use tamper script to bypass WAF

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure correct parameter format to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
