name: "exec"
command: "sh"
args: ["-c"]
enabled: true
# Short description (used in tool list to reduce token consumption)
short_description: "System command execution tool for running shell commands and system operations (use with caution)"
# Detailed tool description
description: |
  System command execution tool for running shell commands and system operations.

  **Main features:**
  - Execute arbitrary shell commands
  - Supports bash, sh, and other shells
  - Can specify a working directory
  - Returns command execution results

  **Use cases:**
  - System administration and maintenance
  - Automated script execution
  - File operations and processing
  - System information gathering

  **Security warning:**
  - ⚠️ This tool can execute arbitrary system commands and carries security risks
  - ⚠️ Use only in controlled environments
  - ⚠️ All command executions are logged
  - ⚠️ Recommended to restrict the scope of executable commands
  - ⚠️ Do not execute untrusted commands
# Parameter definitions
parameters:
  - name: "command"
    type: "string"
    description: |
      The system command to execute. Can be any valid shell command.

      **Format requirements:**
      - Complete shell command
      - May include pipes, redirections, and other shell features
      - Supports environment variables

      **Example values:**
      - Simple command: "ls -la"
      - With pipe: "ps aux | grep nginx"
      - File operation: "cat /etc/passwd"
      - Network command: "curl http://example.com"
      - System info: "uname -a"
      - Find files: "find /var/log -name '*.log'"

      **Notes:**
      - Command is executed in the specified shell
      - Ensure command syntax is correct
      - Be aware of the security implications of the command
      - Required parameter; must not be empty
    required: true
    position: 0
    format: "positional"
  - name: "shell"
    type: "string"
    description: |
      Shell type to use; defaults to sh.

      **Options:**
      - sh: standard shell (default)
      - bash: Bash shell
      - zsh: Z shell
      - any other shell available on the system

      **Example values:**
      - "sh" (default)
      - "bash"
      - "zsh"

      **Notes:**
      - Ensure the specified shell is available on the system
      - Command syntax may differ slightly between shells
    required: false
    default: "sh"
  - name: "workdir"
    type: "string"
    description: |
      Working directory for command execution. If not specified, uses the current working directory.

      **Format requirements:**
      - Absolute or relative path
      - Directory must exist

      **Example values:**
      - "/tmp"
      - "/var/log"
      - "./data"
      - "/home/user/project"

      **Notes:**
      - Ensure the directory exists and is accessible
      - Relative paths are relative to the program's run directory
    required: false
  - name: "additional_args"
    type: "string"
    description: |
      Additional exec arguments. Used to pass exec options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples based on tool characteristics

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure parameter format is correct to avoid command injection
      - This argument is appended directly to the end of the command
    required: false
    format: "positional"
