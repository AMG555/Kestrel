name: "virustotal_search"
command: "python3"
args:
  - "-c"
  - "import sys\nimport json\nimport requests\nimport os\nimport time\n\n# ==================== VirusTotal Configuration ====================\n# Configure your VirusTotal API key here\n# You can also set it via environment variable: VT_API_KEY\n# enabled defaults to false; must be set to true to use this MCP\nVT_API_KEY = \"\"  # Fill in your VirusTotal API key here\n# =======================================================\n\n# VirusTotal API base URL\nBASE_URL = \"https://www.virustotal.com/api/v3\"\n\ndef parse_args():\n    \"\"\"Parse command-line arguments\"\"\"\n    # Try to read JSON config from the first argument\n    if len(sys.argv) > 1:\n        try:\n            arg1 = str(sys.argv[1])\n            config = json.loads(arg1)\n            if isinstance(config, dict):\n                return config\n        except (json.JSONDecodeError, TypeError, ValueError):\n            pass\n\n    # Traditional positional argument mode\n    config = {}\n    if len(sys.argv) > 1:\n        config['domain'] = str(sys.argv[1])\n    if len(sys.argv) > 2:\n        try:\n            config['limit'] = int(sys.argv[2])\n        except (ValueError, TypeError):\n            pass\n    if len(sys.argv) > 3:\n        config['include_ips'] = sys.argv[3].lower() in ('true', '1', 'yes')\n    return config\n\ndef query_virustotal_subdomains(domain, api_key, limit=100, include_ips=False):\n    \"\"\"\n    Query VirusTotal subdomain information\n    \n    Args:\n        domain: target domain\n        api_key: VirusTotal API key\n        limit: max results to return\n        include_ips: whether to include IP address info\n    \n    Returns:\n        dict: query result dictionary\n    \"\"\"\n    # Build API request URL\n    url = f\"{BASE_URL}/domains/{domain}/subdomains\"\n    \n    headers = {\n        \"x-apikey\": api_key,\n        \"accept\": \"application/json\"\n    }\n    \n    params = {\n        \"limit\": min(limit, 40)  # API max per page is 40\n    }\n    \n    all_results = []\n    next_url = None\n    \n    try:\n        # Handle pagination\n        while True:\n            if next_url:\n                response = requests.get(next_url, headers=headers, timeout=30)\n            else:\n                response = requests.get(url, headers=headers, params=params, timeout=30)\n            \n            response.raise_for_status()\n            data = response.json()\n            \n            # Extract subdomain data\n            if 'data' in data and data['data']:\n                for item in data['data']:\n                    if 'id' in item:\n                        subdomain_info = {\n                            'subdomain': item['id'],\n                            'type': item.get('type', 'domain'),\n                        }\n                        \n                        # If include_ips is True, try to get resolved IPs\n                        if include_ips and 'attributes' in item:\n                            attributes = item.get('attributes', {})\n                            # Simplified handling; additional API calls may be needed in practice\n                            subdomain_info['last_dns_records'] = attributes.get('last_dns_records', [])\n                        \n                        all_results.append(subdomain_info)\n                \n                # Check if there is a next page\n                if 'links' in data and 'next' in data['links'] and len(all_results) < limit:\n                    next_url = data['links']['next']\n                    # Avoid rate-limiting\n                    time.sleep(0.5)\n                else:\n                    break\n            else:\n                break\n            \n            # Stop if limit reached\n            if len(all_results) >= limit:\n                break\n        \n        # Process returned results\n        if all_results:\n            return {\n                \"status\": \"success\",\n                \"domain\": domain,\n                \"total_found\": len(all_results),\n                \"results\": all_results[:limit],\n                \"message\": f\"Successfully retrieved {len(all_results[:limit])} subdomains\"\n            }\n        else:\n            return {\n                \"status\": \"success\",\n                \"domain\": domain,\n                \"total_found\": 0,\n                \"results\": [],\n                \"message\": f\"No subdomains found for {domain}\"\n            }\n            \n    except requests.exceptions.RequestException as e:\n        error_msg = str(e)\n        error_result = {\n            \"status\": \"error\",\n            \"message\": f\"API request failed: {error_msg}\",\n            \"suggestion\": \"Check network connectivity, verify the API key, or check if the VirusTotal API service is available\"\n        }\n        \n        # Handle specific HTTP status codes\n        if hasattr(e, 'response') and e.response:\n            status_code = e.response.status_code\n            if status_code == 401:\n                error_result[\"message\"] = \"Invalid or unauthorized API key\"\n                error_result[\"suggestion\"] = \"Check the VirusTotal API key or obtain a valid key at https://www.virustotal.com/\"\n            elif status_code == 429:\n                error_result[\"message\"] = \"API rate limit exceeded\"\n                error_result[\"suggestion\"] = \"Retry later; the VirusTotal free API is limited to 4 requests per minute\"\n            elif status_code == 404:\n                error_result[\"message\"] = f\"Domain '{domain}' not found\"\n        \n        return error_result\n\ntry:\n    config = parse_args()\n    \n    if not isinstance(config, dict):\n        error_result = {\n            \"status\": \"error\",\n            \"message\": f\"Argument parsing error: expected dict but got {type(config).__name__}\",\n            \"type\": \"TypeError\"\n        }\n        print(json.dumps(error_result, ensure_ascii=False, indent=2))\n        sys.exit(1)\n    \n    # Get API key (from config or environment variable)\n    api_key = os.getenv('VT_API_KEY', VT_API_KEY).strip()\n    \n    if not api_key:\n        error_result = {\n            \"status\": \"error\",\n            \"message\": \"Missing VirusTotal API key\",\n            \"required_config\": [\"VT_API_KEY\"],\n            \"note\": \"Set your VirusTotal API key in the VT_API_KEY field in the YAML file, or via the VT_API_KEY environment variable. Keys can be obtained at https://www.virustotal.com/\"\n        }\n        print(json.dumps(error_result, ensure_ascii=False, indent=2))\n        sys.exit(1)\n    \n    # Get required parameters\n    domain = config.get('domain', '').strip()\n    if not domain:\n        error_result = {\n            \"status\": \"error\",\n            \"message\": \"Missing required parameter: domain\",\n            \"required_params\": [\"domain\"],\n            \"examples\": [\n                \"example.com\",\n                \"google.com\",\n                \"baidu.com\"\n            ]\n        }\n        print(json.dumps(error_result, ensure_ascii=False, indent=2))\n        sys.exit(1)\n    \n    # Get optional parameters\n    limit = config.get('limit', 100)\n    try:\n        limit = int(limit)\n        if limit < 1:\n            limit = 100\n        elif limit > 1000:\n            limit = 1000  # cap at 1000\n    except (ValueError, TypeError):\n        limit = 100\n    \n    include_ips = config.get('include_ips', False)\n    if isinstance(include_ips, str):\n        include_ips = include_ips.lower() in ('true', '1', 'yes')\n    \n    # Run query\n    result = query_virustotal_subdomains(domain, api_key, limit, include_ips)\n    \n    # Output result\n    print(json.dumps(result, ensure_ascii=False, indent=2))\n    \nexcept Exception as e:\n    error_result = {\n        \"status\": \"error\",\n        \"message\": f\"Execution error: {str(e)}\",\n        \"type\": type(e).__name__\n    }\n    print(json.dumps(error_result, ensure_ascii=False, indent=2))\n    sys.exit(1)\n"
enabled: false
short_description: "VirusTotal subdomain lookup tool — passively collect subdomains via VirusTotal API"
description: |
  VirusTotal subdomain lookup tool that leverages VirusTotal's aggregated historical DNS data to discover subdomains of a target domain.

  **Key Features:**
  - Passive subdomain collection: retrieves subdomains from VirusTotal historical DNS data
  - Paginated queries: supports fetching large numbers of subdomains
  - IP association: optionally includes DNS resolution records
  - Deduplication: automatically deduplicates returned results

  **Use Cases:**
  - Pre-engagement information gathering for security testing
  - Corporate network asset discovery
  - Attack surface analysis
  - Threat intelligence collection
  - Penetration testing reconnaissance

  **Data sources:**
  VirusTotal aggregates DNS data from multiple sources, including:
  - Historical DNS resolution records
  - Passive DNS databases
  - Certificate transparency logs
  - Security scan data

  **Notes:**
  - **API key required**: must register a VirusTotal account and obtain an API key
  - **Rate limits**: free API is limited to 4 requests per minute
  - **Data freshness**: data is based on historical scan records and may not be real-time
  - **Authorization**: only query targets you have legitimate authorization to test
  - **Quota limits**: free tier has a monthly query quota
parameters:
  - name: "domain"
    type: "string"
    description: |
      Target domain to query (required).

      **Format requirements:**
      - Enter the root domain only — do not include protocol (http://) or path
      - Supports second-level domain queries

      **Example Values:**
      - "example.com"
      - "google.com"
      - "github.com"

      **Notes:**
      - Domain format must be correct
      - Results may include cross-domain subdomains
    required: true
    position: 2
    format: "positional"
  - name: "limit"
    type: "int"
    description: |
      Result count limit (optional).

      **Details:**
      - Default: 40
      - Maximum: 1000 (API limit)
      - Recommended: 100–500

      **Notes:**
      - Very large values may cause request timeouts
      - API returns at most 40 results per page; pagination is handled automatically
    required: false
    position: 3
    format: "positional"
    default: 40
  - name: "include_ips"
    type: "bool"
    description: |
      Whether to include IP address information (optional).

      **Details:**
      - true: include DNS resolution records in results
      - false: return subdomain list only

      **Notes:**
      - Including IPs increases API call count
      - May include historical IPs that are no longer current
    required: false
    position: 4
    format: "positional"
    default: false
