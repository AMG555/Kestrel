name: "strings"
command: "strings"
enabled: true
short_description: "Extract printable strings from binary files"
description: |
  The strings tool extracts printable strings from binary files.

  **Key Features:**
  - String extraction
  - Configurable minimum length
  - Multiple file format support

  **Use Cases:**
  - Binary analysis
  - Malware analysis
  - Forensic analysis
  - Reverse engineering
parameters:
  - name: "file_path"
    type: "string"
    description: "Path to the file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "min_len"
    type: "int"
    description: "Minimum string length"
    required: false
    flag: "-n"
    format: "flag"
    default: 4
  - name: "additional_args"
    type: "string"
    description: |
      Extra strings arguments. Used to pass options not defined in the parameter list.

      **Example Values:**
      - Add commonly used parameter examples based on tool characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure correct parameter format to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
