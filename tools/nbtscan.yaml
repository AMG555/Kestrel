name: "nbtscan"
command: "nbtscan"
enabled: true
short_description: "NetBIOS name scanner"
description: |
  Nbtscan is a NetBIOS name scanner used to discover Windows systems on a network.

  **Key Features:**
  - NetBIOS name scanning
  - Windows system discovery
  - Network mapping
  - Fast scanning

  **Use Cases:**
  - Windows network discovery
  - NetBIOS enumeration
  - Network mapping
  - Penetration testing
parameters:
  - name: "target"
    type: "string"
    description: "Target IP address or range"
    required: true
    position: 0
    format: "positional"
  - name: "verbose"
    type: "bool"
    description: "Verbose output"
    required: false
    flag: "-v"
    format: "flag"
    default: false
  - name: "timeout"
    type: "int"
    description: "Timeout in seconds"
    required: false
    flag: "-t"
    format: "flag"
    default: 2
  - name: "additional_args"
    type: "string"
    description: |
      Extra nbtscan arguments. Used to pass options not defined in the parameter list.

      **Example Values:**
      - Add commonly used parameter examples based on tool characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure correct parameter format to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
