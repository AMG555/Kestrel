# ============================================
# Kestrel Configuration File
# ============================================
# This configuration file supports visual configuration through the Web interface
# Click the "Settings" button in the top right corner to modify the configuration
# ============================================

# ============================================
# System Settings
# ============================================

# Version number displayed in the frontend (optional; uses default version if omitted)
version: "v2.0.0"
# Server configuration
server:
  host: 0.0.0.0 # listen address; 0.0.0.0 means listen on all network interfaces
  port: 8080 # service port; when TLS is not enabled: http://localhost:8080
  # Exact Origins for other trusted Web integrations. Chromium browser extension is auto-detected; no config needed. Do not use wildcards.
  # cors_allowed_origins:
  #   - https://trusted-integration.example
  # --- Optional: HTTPS + HTTP/2 (mitigates browser concurrent connection limits for same-origin HTTP/1.1; multi-stream Deep is more stable) ---
  # TLS enable condition (any one of): tls_enabled: true, or tls_auto_self_sign: true, or both tls_cert_path + tls_key_path configured.
  # After enabling, access via https://127.0.0.1:<port>/; accessing with http:// on the same port will auto-redirect 308 to HTTPS (disable with tls_http_redirect: false).
  tls_enabled: true
  # When HTTPS is enabled, whether plain HTTP auto-redirects to HTTPS (default true; same-port TLS/HTTP sniffing then demux)
  # tls_http_redirect: true
  # Method A (recommended for production): PEM certificate and private key paths
  # tls_cert_path: /path/to/fullchain.pem
  # tls_key_path: /path/to/privkey.pem
  # Method B (local/testing only): in-memory self-signed cert when no certificate files exist (browser will warn untrusted; SAN includes localhost / 127.0.0.1)
  tls_auto_self_sign: true
# Authentication configuration
auth:
  session_duration_hours: 12 # login session duration (hours); re-login required after expiry
# Logging configuration
log:
  level: info # log level: debug, info, warn, error
  output: stdout # log output: stdout, stderr, or a file path
  diagnostic_dir: log # additionally save warn+ diagnostic logs split by local date; relative to process working directory
  diagnostic_retention_days: 14 # retention days (including today); omit or <= 0 to use 14 days
  diagnostic_disabled: false # true disables extra diagnostic logs; restart required after change
# Platform operation audit (System Settings -> Audit Log; does not record conversation content or individual tool calls)
audit:
  enabled: true
  retention_days: 15 # 0 means no automatic cleanup
  max_detail_bytes: 8192
  auth_failure_cooldown_seconds: 60 # minimum audit interval (seconds) for login/password-change failures from the same IP; default 60; -1 disables throttle
# MCP status monitoring execution record retention (tool_executions table)
monitor:
  retention_days: 90 # default 90 if omitted; 0 disables automatic cleanup
# Runtime workspace garbage cleanup (System Settings -> Storage Cleanup)
# Overrides retention policy for Agent workspaces, tool output cache, C2 artefacts, conversation uploads, and other disk artefacts.
# auto_clean is off by default: upgrades will not delete existing data without administrator awareness;
# when off, you can still manually preview and run cleanup on the Storage Cleanup page.
storage:
  auto_clean: false # true enables background scheduled cleanup
  interval_minutes: 60 # background cleanup interval (minutes); minimum 5
  orphan_grace_days: 1 # days before reclaiming directories left behind after session/project deletion
  active_grace_hours: 24 # sessions with recent activity are always skipped to avoid deleting active task data
  # Per-category retention_days: uses built-in defaults if omitted; 0 disables retention-based cleanup (orphan directories are still reclaimed)
  categories:
    workspace: # Agent workspace tmp/workspace; default 30 days
      enabled: true
      retention_days: 30
    reduction: # oversized tool output on disk tmp/reduction; default 7 days (pure derived data)
      enabled: true
      retention_days: 7
    conversation_artifacts: # summaries and oversized input ledger data/conversation_artifacts; default 30 days
      enabled: true
      retention_days: 30
    plantask: # multi-agent plan board skills/.eino/plantask; default 30 days (pure derived data)
      enabled: true
      retention_days: 30
    c2_artifacts: # C2 callback screenshots/uploads/deployed files/payloads tmp/c2; default 30 days
      enabled: true # note: download links for cleaned payloads will become invalid
      retention_days: 30
    chat_uploads: # conversation upload attachments chat_uploads; default 90 days
      enabled: true
      retention_days: 90
    workflow_checkpoints: # workflow checkpoints data/workflow-checkpoints; default 7 days
      enabled: true
      retention_days: 7
    diagnostic_logs: # diagnostic logs log/diagnostic-*.log; default 14 days
      enabled: true # effective independently from log.diagnostic_retention_days; whichever triggers first applies
      retention_days: 14
# ============================================
# Conversation-related configuration
# ============================================

# AI channel configuration (supports multiple OpenAI-compatible / Claude channels)
# default_channel specifies which channel is used for new conversations and tasks without an explicit channel selection.
# Each channels.<id> requires: api_key, base_url, model.
# Supported API providers:
#   - OpenAI: https://api.openai.com/v1
#   - DeepSeek: https://api.deepseek.com/v1
#   - Other OpenAI-compatible API providers
# Common models: gpt-4, gpt-3.5-turbo, deepseek-chat, claude-3-opus, etc.
# provider: options: openai_compatible (default) | claude (Eino native Anthropic Messages API)
ai:
  default_channel: qwen-max
  channels:
    qwen-max:
      name: Qwen Max
      provider: openai_compatible
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-xxxxxxx
      model: qwen3-max
      max_total_tokens: 120000
      max_completion_tokens: 32768
      # Eino path model reasoning: DeepSeek/OpenAI use thinking / reasoning_effort; Claude 4.6+ uses adaptive + output_config.effort (only sent when effort is explicitly configured); 3.7 uses enabled+budget_tokens:10000 (doc example), effort is not mapped, use extra_request_fields for custom budget
      reasoning:
        mode: on # auto | on | off; off: OpenAI/Claude do not attach reasoning fields; DeepSeek sends thinking.type=disabled (thinking is on by default)
        effort: high # low | medium | high | max | xhigh (highest: OpenAI commonly uses xhigh, some gateways use max; sent as-is); empty means unspecified
        allow_client_reasoning: true # when false, ignores the reasoning field in conversation request body; uses only the settings below
        profile: openai_compat # auto | deepseek_compat | openai_compat | output_config_effort
        # extra_request_fields: {} # optional: admin-defined root-level JSON fragment (advanced)
    # qwen-plus:
    #   name: Qwen Plus Fallback
    #   provider: openai_compatible
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key: sk-xxxxxxx
    #   model: qwen-plus
    #   max_total_tokens: 120000
    #   max_completion_tokens: 32768
# Visual analysis (analyze_image MCP tool; images only appear in a single VL call; Agent context only retains text summary)
vision:
  enabled: false # registers analyze_image when true and model is non-empty
  model: qwen-vl # VL model name (required when enabled)
  api_key: "" # leave empty to reuse default AI channel api_key
  base_url: "" # leave empty to reuse default AI channel base_url
  provider: # leave empty to reuse default AI channel provider (openai_compatible | claude)
  max_image_bytes: 5242880 # raw file size limit (bytes); default 5MB
  max_dimension: 2048 # long-edge resize pixels
  jpeg_quality: 82
  max_payload_bytes: 524288 # encoded payload limit sent to VL API; default 512KB
  skip_preprocess_below_bytes: 2097152 # send original image directly when <2MB and long-edge<=max_dimension and <=max_payload; 0=always compress
  detail: auto # low | high | auto (Eino ImageURLDetail)
  timeout_seconds: 60
# ============================================
# Asset management (cyberspace mapping search) configuration (optional)
# ============================================
# Used by the "Asset Management → Information Gathering" page to call FOFA / ZoomEye / Quake / Shodan APIs
# Backend-proxied requests to avoid exposing keys in the frontend; environment variables take higher priority
fofa:
  base_url: https://fofa.info/api/v1/search/all # optional; leave empty to use the default
  api_key: "" # FOFA API Key (optional; recommended to fill in System Settings)
zoomeye:
  base_url: https://api.zoomeye.ai/v2/search # optional; leave empty to use the default
  api_key: "" # ZoomEye API Key; can also be configured via ZOOMEYE_API_KEY environment variable
quake:
  base_url: https://quake.360.net/api/v3/search/quake_service # optional; leave empty to use the default
  api_key: "" # Quake API Token; can also be configured via QUAKE_API_KEY environment variable
shodan:
  base_url: https://api.shodan.io # optional; leave empty to use the default
  api_key: "" # Shodan API Key; can also be configured via SHODAN_API_KEY environment variable
# Agent configuration
# When the maximum iteration count is reached, the AI will automatically summarise the test results
agent:
  max_iterations: 12000 # global maximum iteration count (used by single-agent / Deep / Supervisor / Plan-Execute primary executor / sub-agents; max_iterations>0 in agents/*.md overrides individually)
  tool_timeout_minutes: 60 # maximum duration per tool execution (minutes); auto-terminates on timeout; 0 = unlimited (not recommended; prone to long hangs)
  tool_wait_timeout_seconds: 300 # maximum wait per tool round (seconds); returns execution_id when elapsed while worker continues in background; use wait_tool_execution to wait further; 0=wait until complete
  external_mcp_max_concurrent_per_server: 5 # concurrent tools per external MCP server; 0=default 2; negative=unlimited
  external_mcp_max_concurrent_total: 16 # global concurrent limit for all external MCP tools; 0=default 16; negative=unlimited
  external_mcp_circuit_failure_threshold: 15 # consecutive failures before circuit-breaking a single external MCP server; 0=default 3; negative=disable circuit breaker
  external_mcp_circuit_cooldown_seconds: 60 # circuit breaker cooldown seconds; 0=default 60
  shell_no_output_timeout_seconds: 1200 # terminate execute/exec when no new output for this duration (seconds); general hang prevention; 0=default 300; -1=disable
  workspace_root_dir: "" # session working directory root path (curl/wget downloads, read_file/glob/grep local analysis); empty=tmp/workspace, isolated under projects/{id} or conversations/{id}; do not use system /tmp
  # system_prompt_path: prompts/single-agent.md # optional: single-agent system prompt file (relative to this config file directory); replaces built-in prompt when non-empty and readable

  system_prompt_path: ""
# Tool guard: edits and saves in "Security → Tool Guard" take effect immediately; independent from the HITL approval whitelist.
# Older configs without tool_guard also enable government domain protection by default. Manual YAML edits require a restart.
tool_guard:
  enabled: true
  rules:
    - id: government-domains
      name: Government Website Protection
      enabled: true
      # Go/RE2 regex; named capture group "match" is used in the message as {match}.
      pattern: '(?i)(?:^|[^\p{L}\p{M}\p{N}_.-])(?P<match>(?:(?:[\p{L}\p{M}\p{N}_*-]+\.)+gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*|gov(?:\.[\p{L}\p{M}\p{N}_*-]+)+|\.gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*)\.?)(?:$|[^\p{L}\p{M}\p{N}_.-])'
      # Supports {match}, {tool}, {rule}; leave empty to use the generic message.
      message: 'Detected {match} — attacking government websites is prohibited. Please check the target and authorization scope, and switch to an authorized non-government target.'

# Human-in-the-loop (HITL) global whitelist: tools listed here are always exempt from approval; merged (union) with the conversation-page "Whitelist Tools (comma-separated)"; the sidebar "Apply" can merge into this list and take effect immediately.
# For non-whitelisted tools when reviewer=audit_agent, the prompt is selected based on the session HITL mode:
#   approval → audit_agent_prompt
#   review_edit → audit_agent_prompt_review_edit (can modify parameters then approve)
hitl:
  # Global default HITL mode: off=disabled, approval=approval mode, review_edit=review-and-edit; new sessions without individual config inherit this
  default_mode: off
  # Global default reviewer: human=human approval, audit_agent=audit Agent; new sessions without individual config inherit this
  default_reviewer: human
  # Global default approval wait timeout (seconds): 300=5 minutes, 0=unlimited; new sessions without individual config inherit this
  default_timeout_seconds: 300
  # Audit Agent backend (choose one): openai=compatible-protocol chat model (prompt JSON); typesafe=TypeSafe Jev structured approve/block.
  audit_backend: openai
  # Audit Agent dedicated model. openai backend fields: leave empty to reuse the main model; typesafe backend: api_key required and does not inherit the main model key.
  audit_model:
    provider: "" # openai / claude; only effective for openai backend; leave empty to follow openai.provider
    base_url: "" # openai backend: leave empty to follow main model; typesafe backend: leave empty to use https://api.typesafe.ai
    api_key: "" # openai backend: leave empty to follow main model; typesafe backend: enter TypeSafe API Key
    model: "" # openai backend: recommend a smaller model; typesafe backend: leave empty to use jev-latest
  # Decided audit log retention days (consistent with MCP monitoring; default 90 if omitted; 0 disables automatic cleanup)
  retention_days: 90
  # Add/remove actual tool names from your environment (case-insensitive, consistent with sidebar); change to [] if global whitelist is not needed
  tool_whitelist: [read_file, ls, list_dir, glob, grep, tool_search, upsert_project_fact, get_project_fact, list_project_facts, search_project_facts, list_vulnerabilities, get_vulnerability, get_asset, query_assets, list_knowledge_risk_types, get_tool_execution, wait_tool_execution, batch_task_list, batch_task_get, manage_webshell_list, c2_event, c2_file]
  # audit_agent_prompt: |  # approval mode; leave empty to use built-in default; editable on the "HITL" page. openai backend: used as chat prompt; typesafe backend: used as Jev organisation policy
  # audit_agent_prompt_review_edit: |  # review-and-edit mode; leave empty to use built-in default

  audit_agent_prompt: |-
    You are the Kestrel human-in-the-loop audit Agent. Review tool calls the Agent is about to execute to determine whether they would cause material damage to the system.

    You will receive a JSON object containing fields: hitlMode, toolName, arguments/argumentsObj, userMessage, thinking, reasoningChain, planning, etc.

    Rule priority:
    - Must-reject rules
    - Must-approve rules
    - Default-approve rules

    Rule matching requirements:
    - If both reject and approve rules are matched, must reject.
    - Every decision must cite a rule number; outputting "matched rule: none" is not allowed.
    - When no explicit reject or approve rule is matched and no clear destructive behaviour is found, match D1: default approve.
    - Do not judge a script harmless solely because of "local execution", "settings timed out", or "filename contains test"; always check the actual command, code, or request parameters.
    - If the script content is not visible, state "current parameters show no explicit high-risk operation" — do not assert "no persistence impact".

    Decision baseline (default: approve):
    - The vast majority of penetration testing operations (including all attack payloads) should be approved
    - Before deciding, determine: 1. What is this request doing (understand the request content)? 2. What are the consequences of this request?
    - Reject only when "it will directly and clearly disrupt the normal operation of the target business system, or cause real user data loss / irreversible tampering"
    - When information is insufficient, parameters are slightly broad, or intent is only probing → approve
    - When in doubt → approve (better to let through a recoverable test than to wrongly block a legitimate attack)

    High-risk situations that must be rejected (examples, non-exhaustive):
    - Modifying/resetting any user or admin password, forcibly logging out real users
    - Modifying server or service configuration (system config, web/database parameters, firewall, startup items, scheduled tasks)
    - Modifying/creating/deleting users, roles, or permissions (account system tampering)
    - Deleting or mass-destroying data/files (DROP/TRUNCATE/DELETE entire tables, rm critical files, clearing databases)
    - Stopping, disabling, or restarting business services (systemctl stop, killing critical processes, shutdown, reboot)
    - Mass load testing or high concurrency causing DoS

    The following situations must be approved (even if they appear "aggressive" or involve write operations):
    - All vulnerability probing and exploitation payloads (SQL injection including read/write, command injection, deserialization, file inclusion, path traversal, SSRF, SSTI, XXE, etc.)
    - File upload testing, including uploading webshells or writing webshell files
    - Command execution probing, reverse shells, dnslog / data exfiltration probing
    - Database command execution, file write, scheduled task write, memory implant injection and other getshell exploitation
    - Password brute-force at normal rate (non-DoS level)
    - Information gathering, port/directory scanning, enumeration, crawling
    - Read, query, and probe operations (including sensitive files)
    - Post-compromise harmless reconnaissance commands (whoami/id/uname/ls/cat etc.)
    - Requests with broad parameters but no clear destructive intent

    Decision principles:
    - "Write" operations alone are not a reason to block — penetration testing relies heavily on writes (injection, upload, brute-force, getshell)
    - The key is whether it damages "business availability / critical data integrity"
    - Reject only when clearly matching the reject list above

    Output only a single line of JSON, no markdown code block:
    {"decision":"approve"|"reject","comment":"actual operation: ...; post-success consequences: ...; matched rule: ..."}
  audit_agent_prompt_review_edit: |-
    You are the Kestrel human-in-the-loop audit Agent. Review tool calls the Agent is about to execute to determine whether they would cause material damage to the system.

    You will receive a JSON object containing fields: hitlMode, toolName, arguments/argumentsObj, userMessage, thinking, reasoningChain, planning, etc.

    Rule priority:
    - Must-reject rules
    - Must-approve rules
    - Default-approve rules

    Rule matching requirements:
    - If both reject and approve rules are matched, must reject.
    - Every decision must cite a rule number; outputting "matched rule: none" is not allowed.
    - When no explicit reject or approve rule is matched and no clear destructive behaviour is found, match D1: default approve.
    - Do not judge a script harmless solely because of "local execution", "settings timed out", or "filename contains test"; always check the actual command, code, or request parameters.
    - If the script content is not visible, state "current parameters show no explicit high-risk operation" — do not assert "no persistence impact".

    Decision baseline (default: approve):
    - The vast majority of penetration testing operations (including all attack payloads) should be approved
    - Before deciding, determine: 1. What is this request doing (understand the request content)? 2. What are the consequences of this request?
    - Reject only when "it will directly and clearly disrupt the normal operation of the target business system, or cause real user data loss / irreversible tampering"
    - When information is insufficient, parameters are slightly broad, or intent is only probing → approve
    - When in doubt → approve (better to let through a recoverable test than to wrongly block a legitimate attack)

    High-risk situations that must be rejected (examples, non-exhaustive):
    - Modifying/resetting any user or admin password, forcibly logging out real users
    - Modifying server or service configuration (system config, web/database parameters, firewall, startup items, scheduled tasks)
    - Modifying/creating/deleting users, roles, or permissions (account system tampering)
    - Deleting or mass-destroying data/files (DROP/TRUNCATE/DELETE entire tables, rm critical files, clearing databases)
    - Stopping, disabling, or restarting business services (systemctl stop, killing critical processes, shutdown, reboot)
    - Mass load testing or high concurrency causing DoS

    The following situations must be approved (even if they appear "aggressive" or involve write operations):
    - All vulnerability probing and exploitation payloads (SQL injection including read/write, command injection, deserialization, file inclusion, path traversal, SSRF, SSTI, XXE, etc.)
    - File upload testing, including uploading webshells or writing webshell files
    - Command execution probing, reverse shells, dnslog / data exfiltration probing
    - Database command execution, file write, scheduled task write, memory implant injection and other getshell exploitation
    - Password brute-force at normal rate (non-DoS level)
    - Information gathering, port/directory scanning, enumeration, crawling
    - Read, query, and probe operations (including sensitive files)
    - Post-compromise harmless reconnaissance commands (whoami/id/uname/ls/cat etc.)
    - Requests with broad parameters but no clear destructive intent

    Decision principles:
    - "Write" operations alone are not a reason to block — penetration testing relies heavily on writes (injection, upload, brute-force, getshell)
    - The key is whether it damages "business availability / critical data integrity"
    - Reject only when clearly matching the reject list above

    Output only a single line of JSON, no markdown code block:
    {"decision":"approve"|"reject","comment":"actual operation: ...; post-success consequences: ...; matched rule: ...","editedArguments":{...}}

    editedArguments rules (only fill in when approving with parameter edits; otherwise omit the field):
    - Provide the complete replacement tool parameter object; key names consistent with argumentsObj
    - Make only the minimal necessary changes to narrow the scope or eliminate risk (e.g. restrict path, remove dangerous flags)
    - Do not expand the attack surface: do not expand target scope, escalate privileges, or introduce destructive parameters
    - If safe parameter editing is not possible and the above high-risk conditions are present, reject — do not force an approve
# Multi-agent and Eino single-agent (CloudWeGo Eino ADK; single-agent entry /api/eino-agent*, multi-agent /api/multi-agent*)
# Dependencies pulled in go.mod; if download fails, set: go env -w GOPROXY=https://goproxy.cn,direct
# Deep / Plan-Execute / Supervisor is specified in the request body's orchestration field by the conversation page and WebShell mode selection; robots use robot_default_agent_mode
multi_agent:
  enabled: true
  robot_default_agent_mode: eino_single # WeCom/DingTalk/Feishu robot default: eino_single | deep | plan_execute | supervisor
  batch_use_multi_agent: false # when true, each sub-task in a "batch task" queue also uses Eino multi-agent (higher cost)
  # plan_execute dedicated: outer execute↔replan loop limit; 0 means Eino default 10. Primary/sub-agent ReAct rounds see agent.max_iterations.
  plan_execute_loop_max_iterations: 0
  sub_agent_user_context_max_runes: 0 # inject user original text into sub-agent task description; 0=no truncation (default), >0=total character limit, negative=disabled
  without_general_sub_agent: false # when false, keep Deep's built-in general-purpose sub-agent
  without_write_todos: false
  orchestrator_instruction: "" # Deep primary agent: agents/orchestrator.md (or a single .md with kind: orchestrator) body takes priority; use this when body is empty; both empty → Eino default
  orchestrator_instruction_plan_execute: "" # plan_execute primary agent: agents/orchestrator-plan-execute.md body takes priority; use this when body is empty; both empty → use built-in plan_execute prompt (does not use Deep's orchestrator_instruction)
  orchestrator_instruction_supervisor: "" # supervisor primary agent: agents/orchestrator-supervisor.md body takes priority; use this when body is empty; both empty → use built-in supervisor prompt (transfer/exit instructions are still appended at runtime; does not use Deep's orchestrator_instruction)
  # Eino official Skills: progressive disclosure + optional local file/Shell (eino-ext local backend). Skills directory see skills_dir.
  eino_skills:
    disable: false # true: do not register skill progressive-disclosure middleware or mount local FS/Shell tools; false: load according to the switches below
    filesystem_tools: true # true: register read_file/glob/grep/write/edit/execute (use cautiously in authorised environments); false: skills only, no local read/write or Shell
    skill_tool_name: skill # "load skill" tool name callable by the model; generally keep as skill; must match the call name in the skill package documentation
  # Eino ADK middleware and Deep/Supervisor/plan_execute Executor parameter tuning (struct see internal/config/config.go → MultiAgentEinoMiddlewareConfig)
  # plan_execute: the following patch/reduction/tool_search/plantask etc. also apply to the Executor (via ExecPreMiddlewares); Planner/Replanner do not attach MCP pre-middleware.
  eino_middleware:
    patch_tool_calls: true # true: repair dangling tool_call without tool_result in history (more stable after streaming interruption/retry); false: disable; field omitted defaults to true
    tool_search_enable: true # true: enable tool_search when tool count ≥ min; only the first N tools are always present, others unlocked on-demand by regex; saves tokens and reduces mis-selection; false: all tools in context
    tool_search_min_tools: 20 # minimum tool count before enabling tool_search (avoids overhead when there are few tools); used with always_visible
    tool_search_always_visible: 12 # number of tools always exposed directly to the model (in role tool list order); others enter the dynamic pool, requiring tool_search to unlock
    tool_search_always_visible_tools: [read_file, glob, grep, analyze_image, write_file, edit_file, execute, task, transfer_to_agent, exit, write_todos, skill, tool_search, TaskCreate, TaskGet, TaskUpdate, TaskList, record_vulnerability, list_vulnerabilities, get_vulnerability, get_tool_execution, wait_tool_execution, cancel_tool_execution, list_knowledge_risk_types, search_knowledge_base, webshell_exec, webshell_file_list, webshell_file_read, webshell_file_write, manage_webshell_list, manage_webshell_add, manage_webshell_update, manage_webshell_delete, manage_webshell_test, batch_task_list, batch_task_get, batch_task_start, batch_task_rerun, batch_task_pause, batch_task_update_metadata, batch_task_update_schedule, batch_task_schedule_enabled, batch_task_update_task, batch_task_remove_task, batch_task_delete, batch_task_create, batch_task_add_task, http-framework-test, exec] # backend built-in always-present tool whitelist (takes priority over always_visible count policy)
    plantask_enable: true # P0: primary agent mounts TaskCreate/Get/Update/List structured task board; requires eino_skills available and skills_dir present
    plantask_rel_dir: .eino/plantask # task files relative to skills_dir, subdirectory per session: skills/.eino/plantask/<conversationId>/
    reduction_enable: true # true: large tool output is truncated and persisted to a local file (tmp/reduction/.../trunc/<id>); context only keeps <persisted-output> preview; does not depend on eino_skills
    reduction_max_length_for_trunc: 100000 # when a single tool result exceeds this byte count: full text written to local trunc file, returns truncated preview with path (MCP/exec and reduction share this threshold)
    reduction_max_tokens_for_clear: 60000 # historical tool result cleanup threshold (tokens); should be below max_total_tokens * summarization_trigger_ratio
    reduction_root_dir: "" # non-empty: root path for truncated/cleared content on disk; empty: tmp/reduction under project directory (isolated by session/project)
    reduction_clear_exclude: [] # additional tool names excluded from the "cleanup phase" (merged with built-in exclusions like task/transfer/exit); use YAML list syntax when needed
    reduction_sub_agents: true # true: sub-agents also attach reduction; false: only the orchestration primary agent uses reduction
    summarization_trigger_ratio: 0.8 # summarization trigger ratio (max_total_tokens * ratio); recommended 0.75~0.85
    summarization_output_reserve_tokens: 40960 # reserved tokens for summary model output; summary input budget = trigger threshold - this value
    summarization_emit_internal_events: true # true: emit summarization internal events (useful for diagnostics)
    summarization_user_intent_ledger_max_runes: 96000 # total character limit for the "original user input and constraints ledger" injected into model context after compression; DB original messages are not trimmed
    summarization_user_intent_ledger_entry_max_runes: 16000 # character limit per user message in the ledger; excess only trims the model-visible ledger, not the DB original
    latest_user_message_max_runes: 48000 # character limit for the latest user message entering model context this round; when exceeded, full text is persisted and only head/tail preview is injected
    latest_user_message_head_runes: 24000 # head preview character count for oversized current-round user messages
    latest_user_message_tail_runes: 24000 # tail preview character count for oversized current-round user messages
    plan_execute_user_input_budget_ratio: 0.35 # userInput budget ratio in plan_execute (shared by planner/replanner/executor)
    plan_execute_executed_steps_budget_ratio: 0.2 # executed_steps budget ratio in plan_execute
    plan_execute_max_step_result_runes: 4000 # maximum character count per step result in plan_execute (truncated if exceeded)
    plan_execute_keep_last_steps: 8 # keep only the most recent N step bodies in plan_execute; earlier steps are collapsed to headings
    checkpoint_dir: "" # chat pipeline no longer uses ADK checkpoints; cross-round model state is unified via conversations.last_react_*, making stale context easier to diagnose
    model_retry_max_retries: 0 # Eino native ChatModel retry; retries on 408/409/425/429/5xx/network jitter/empty streaming output; 0=default 4 (permanent 4xx not retried)
    model_retry_max_backoff_sec: 0 # Eino native ChatModel retry single-backoff upper limit (seconds); 0=default 30
    model_failover_channels: [] # Eino native ChatModel failover; fill with ai.channels IDs, e.g. [qwen-plus]; switches in order after retries are exhausted
    model_failover_max_retries: 0 # maximum attempts per failover channel; 0=try all model_failover_channels
    empty_response_continue_max_attempts: 0 # Handler back-off continuation attempts when Run succeeds but no assistant body is captured (including streaming interruption); 0=default 5
    deep_output_key: final_answer # P0: Eino session writes final assistant conclusion (framework internal; Deep/Supervisor primary/eino_single)
    task_tool_description_prefix: "" # non-empty: only Deep's task tool uses a custom description prefix, sub-agent names are appended at runtime; empty → Eino default generation logic
  # Eino callbacks + OpenTelemetry: framework-level spans (aligned with Zap); eino_trace_* is not pushed to end-user UI by default (see sse_trace_to_client)
  eino_callbacks:
    enabled: true
    # log_only=Zap+OTel only (recommended default) | sse/full=enables streaming callback copy closure etc. (full includes stream hooks)
    mode: log_only
    sse_trace_to_client: false # true: when mode is sse/full, push eino_trace_* to frontend timeline (for debugging / intranet demos)
    max_input_summary_runes: 400
    max_output_summary_runes: 400
    zap_verbose: false # true: Debug includes input/output summary
    otel:
      enabled: true
      service_name: kestrel
      exporter: stdout # none | stdout (development/local) | otlphttp (production connected to Collector)
      otlp_endpoint: localhost:4318 # used when otlphttp; host:port, path is fixed at /v1/traces
      sample_ratio: 1.0 # 0~1, ParentBased+TraceIDRatio
# Database configuration
database:
  path: data/conversations.db # SQLite database file path, used to store conversation history and messages
  knowledge_db_path: data/knowledge.db # Knowledge base database file path (optional; uses session database if empty), stores knowledge base items and vector embeddings; can be copied and reused independently
# ============================================
# Task Management Configuration
# ============================================
# (Configuration items are included in the conversation-related configuration section)

# ============================================
# Vulnerability Management Configuration
# ============================================

# Security tool configuration
# The system loads all .yaml format tool configuration files from this directory
# Recommended: create a separate configuration file for each tool in the tools/ directory
security:
  # auto: native Job Object on Windows; Unix watchdog unless cgroup_root is set.
  # Linux production: configure a systemd service with Delegate=cpu memory pids; set
  # mode: required, cgroup_root: auto. Explicit isolation errors fail closed.
  process_isolation:
    mode: auto
    cgroup_root: ""
    max_processes: 256
    memory_max_bytes: 2147483648
    cpu_quota_micros: 0 # 0=no CPU cap; 100000=one core (100 ms period)
  tools_dir: tools # Tool configuration directory (relative to config file location)
  # Tool description mode: source of description exposed to AI/API when loading tools
  #   short - prefer short_description (concise, saves tokens); falls back to description if empty
  #   full  - use description (full detail)
  tool_description_mode: full
# ============================================
# MCP configuration
# ============================================

# MCP protocol configuration
# MCP (Model Context Protocol) — used for tool registration and invocation
mcp:
  enabled: false # Enable MCP server (HTTP mode)
  host: 127.0.0.1 # MCP server listen address; modify explicitly and configure network-level access control when remote access is needed
  port: 8081 # MCP server port
  auth_header: "X-MCP-Token" # Optional global service credential header; for regular calls use user Authorization: Bearer Token
  auth_header_value: "" # Global service credential value; only effective when allow_global_access=true
  allow_global_access: false # High-risk compatibility mode: static key mapped to global service identity; use user Bearer Token by default
# External MCP configuration
external_mcp:
  servers: {}
# Built-in C2: set to false if this instance only handles conversations/knowledge; disables listener and C2 MCP tools. Defaults to enabled when this section is omitted.
c2:
  enabled: true
# ============================================
# Knowledge base configuration
# ============================================
knowledge:
  enabled: false # Enable knowledge retrieval
  base_path: knowledge_base # Knowledge base directory path (relative to config file location)
  embedding:
    provider: openai # Embedding model provider (currently only openai is supported)
    model: text-embedding-v4 # Embedding model name
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1 # Leave empty to use the OpenAI base_url
    api_key: sk-xxxxxxx # Leave empty to use the OpenAI api_key
  retrieval:
    top_k: 5 # Number of top-K results returned by retrieval
    similarity_threshold: 0.4 # Cosine similarity threshold (0-1); results below this value are filtered out
    # Eino MultiQuery: LLM rewrites the query, runs multi-path vector retrieval, then fuses results (always enabled)
    multi_query:
      max_queries: 4 # Max rewrite variants (including semantic coverage); 3–4 recommended
    # Re-ranking (always enabled): dashscope uses gte-rerank; other OpenAI-compatible endpoints use /v1/rerank
    rerank:
      provider: "" # Empty = inferred from base_url: dashscope | cohere
      model: "" # Empty = dashscope→gte-rerank, cohere→rerank-multilingual-v3.0
      base_url: "" # Leave empty to use embedding/openai base_url
      api_key: "" # Leave empty to use embedding/openai api_key
    post_retrieve:
      prefetch_top_k: 20 # Number of vector candidates per MultiQuery variant; 0 = built-in max(top_k*4, 20)
      max_context_chars: 0 # 0 = no limit; otherwise the total Unicode character cap for returned content (whole chunk)
      max_context_tokens: 0 # 0 = no limit; tiktoken total token cap
    sub_index_filter: ""
  # ============================================
  # Indexing configuration (to address API rate-limit issues)
  # ============================================
  indexing:
    # Chunking configuration
    chunk_size: 512 # Max tokens per chunk (default 512); long texts are split into multiple chunks
    chunk_overlap: 50 # Token overlap between chunks (default 50); maintains context continuity
    max_chunks_per_item: 0 # Max chunks per knowledge item (0 = no limit); prevents a single file from consuming too much API quota
    # Rate-limit configuration (to resolve 429 errors)
    max_rpm: 0 # Max requests per minute (0 = no limit); e.g. OpenAI default is 200 RPM
    rate_limit_delay_ms: 300 # Interval between requests in milliseconds (default 300); set to 0 for no limit
    # Recommended: 200 req/min ≈ 300 ms, 100 req/min ≈ 600 ms

    # Retry configuration
    max_retries: 3 # Max retries (default 3); automatically retries on rate-limit or server errors
    retry_delay_ms: 1000 # Retry interval in milliseconds (default 1000); delay increments with each retry
    # Chunking strategy (Eino): markdown_then_recursive = split by Markdown headings then recursively; recursive = recursive only. Defaults to markdown_then_recursive when empty.
    chunk_strategy: markdown_then_recursive
    # Embedding HTTP request timeout (seconds). 0 = use built-in default (typically 120), consistent with vectorisation API client.
    request_timeout_seconds: 120
    # true: during indexing prefer disk file content referenced by knowledge item file_path (Eino FileLoader); false: use content stored in DB. Falls back to DB on read failure.
    prefer_source_file: false
    # Max texts per embedding API request (index writes are batched accordingly). Must be ≤ provider limit (some compatible endpoints allow at most 10); too large may cause 400.
    batch_size: 10
    # Eino indexer.WithSubIndexes: logical partition label list written to vector table sub_indexes; retrieval can filter with sub_index_filter. Use [] if not needed.
    sub_indexes: []
# ============================================
# Robot / chatbot configuration (WeCom, DingTalk, Feishu/Lark)
# ============================================
# Allows interacting with Kestrel on mobile via WeCom/DingTalk/Feishu without deploying to a server.
# Configurable in System Settings → Robot Settings
robots:
  wechat: # WeChat iLink (personal WeChat ClawBot, scan QR to bind)
    enabled: false
    # Auth defaults to user_binding; dedicated bots can use service_account and must restrict real senders
    auth:
      mode: user_binding # user_binding | service_account
      # service_user_id: "admin or dedicated service account RBAC user ID"
      # allowed_external_users: ["t:tenant|u:sender"]
    bot_token: ""
    ilink_bot_id: ""
    ilink_user_id: ""
    base_url: https://ilinkai.weixin.qq.com
    bot_type: "3"
    bot_agent: Kestrel/1.0
  wecom: # WeCom (Enterprise WeChat)
    enabled: false
    auth:
      mode: user_binding
    token: ""
    encoding_aes_key: ""
    corp_id: ""
    secret: ""
    agent_id: 0
  dingtalk: # DingTalk
    enabled: false
    auth:
      mode: user_binding
    client_id: ""
    client_secret: ""
    allow_conversation_id_fallback: false
  lark: # Feishu/Lark
    enabled: false
    auth:
      mode: user_binding
    app_id: ""
    app_secret: ""
    verify_token: ""
    allow_chat_id_fallback: false
  telegram: # Telegram
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    bot_username: ""
    allow_group_messages: false
  slack: # Slack
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    app_token: ""
  discord: # Discord
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    allow_guild_messages: false
  qq: # QQ Bot
    enabled: false
    auth:
      mode: user_binding
    app_id: ""
    client_secret: ""
    sandbox: true
# ============================================
# Skills configuration
# ============================================

# Skills directory: each subdirectory contains only a standard SKILL.md (Agent Skills: front matter with name and description only) plus optional auxiliary files; no SKILL.yaml.
# Example: skills/kestrel-eino-demo/
skills_dir: skills # Skills configuration directory (relative to config file location)
# ============================================
# Multi-agent sub-agents (Markdown, single source of truth)
# ============================================
# Each .md: YAML front matter (name / id / description / tools / bind_role / optional max_iterations>0 to override global / optional kind: orchestrator) + body is the system prompt
# Orchestrator: fixed filename orchestrator.md, or any filename + front matter kind: orchestrator (only one allowed per directory); the orchestrator is not included in the task sub-agent list
# Advanced: sub_agents can still be defined in the multi_agent block; they are merged with the agents directory, and .md overrides YAML for duplicate IDs
agents_dir: agents
# ============================================
# Role configuration
# ============================================

# The system loads all .yaml role configuration files from this directory
# Create a separate config file for each role, e.g.: roles/CTF.yaml, roles/Default.yaml, etc.
roles_dir: roles # Role configuration directory (relative to config file location)
# ============================================
# Project management and fact blackboard
# ============================================
project:
  enabled: true
  # default_project_id: "" # Optional: default project ID for conversations created by robots/batch tasks
  fact_index_max_runes: 65000
  # Fact relationship overview section budget (reserved from total index budget)
  fact_index_path_max_runes: 10000
  fact_summary_max_runes: 24000
  default_inject_deprecated: false
