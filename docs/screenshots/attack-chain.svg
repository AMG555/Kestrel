<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="#0d1117"/>

  <!-- Sidebar -->
  <rect width="220" height="800" fill="#161b22"/>
  <line x1="220" y1="0" x2="220" y2="800" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="32" fill="#58a6ff" font-size="17" font-weight="700">⚔ Kestrel</text>
  <text x="16" y="48" fill="#8b949e" font-size="10">Security Operations Platform</text>
  <line x1="0" y1="56" x2="220" y2="56" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="84" fill="#e6edf3" font-size="13">⬡  Dashboard</text>
  <!-- Projects active -->
  <rect x="0" y="96" width="220" height="32" fill="#21262d"/>
  <rect x="0" y="96" width="3" height="32" fill="#58a6ff"/>
  <text x="16" y="116" fill="#58a6ff" font-size="13">📁 Projects</text>
  <text x="16" y="140" fill="#e6edf3" font-size="13">🤖 Agent</text>
  <text x="16" y="166" fill="#e6edf3" font-size="13">📦 Assets</text>
  <text x="16" y="192" fill="#e6edf3" font-size="13">🛡  Vulnerabilities</text>
  <text x="16" y="218" fill="#e6edf3" font-size="13">📋 Audit Logs</text>
  <line x1="0" y1="752" x2="220" y2="752" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="770" fill="#8b949e" font-size="12">admin</text>

  <!-- Page header -->
  <text x="244" y="38" fill="#e6edf3" font-size="20" font-weight="700">Attack Chain — recon-alpha</text>
  <!-- Export button -->
  <rect x="1084" y="16" width="80" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="1124" y="34" fill="#e6edf3" font-size="12" text-anchor="middle">Export SVG</text>
  <rect x="1174" y="16" width="80" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="1214" y="34" fill="#e6edf3" font-size="12" text-anchor="middle">Export PNG</text>

  <!-- Graph canvas -->
  <rect x="236" y="56" width="1028" height="700" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- ── Layer 0: Initial Access ─────────────────────────────────────────── -->
  <text x="420" y="90" fill="#8b949e" font-size="11" text-anchor="middle">INITIAL ACCESS</text>

  <!-- Node: subdomain enum -->
  <rect x="320" y="100" width="200" height="64" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="420" y="123" fill="#58a6ff" font-size="11" font-weight="600" text-anchor="middle">Subdomain Enumeration</text>
  <text x="420" y="140" fill="#8b949e" font-size="10" text-anchor="middle">subdomain_enum</text>
  <rect x="368" y="150" width="60" height="16" rx="8" fill="#3fb95022"/>
  <text x="398" y="161" fill="#3fb950" font-size="10" font-weight="600" text-anchor="middle">✓ done</text>
  <text x="436" y="161" fill="#8b949e" font-size="10">score: 2</text>

  <!-- ── Layer 1: Recon ──────────────────────────────────────────────────── -->
  <text x="690" y="90" fill="#8b949e" font-size="11" text-anchor="middle">RECON</text>

  <!-- Node: http probe -->
  <rect x="580" y="100" width="200" height="64" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="680" y="123" fill="#58a6ff" font-size="11" font-weight="600" text-anchor="middle">HTTP Service Probe</text>
  <text x="680" y="140" fill="#8b949e" font-size="10" text-anchor="middle">http_probe × 11 hosts</text>
  <rect x="628" y="150" width="60" height="16" rx="8" fill="#3fb95022"/>
  <text x="658" y="161" fill="#3fb950" font-size="10" font-weight="600" text-anchor="middle">✓ done</text>
  <text x="696" y="161" fill="#8b949e" font-size="10">score: 3</text>

  <!-- Node: ssl check -->
  <rect x="580" y="240" width="200" height="64" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="680" y="263" fill="#58a6ff" font-size="11" font-weight="600" text-anchor="middle">TLS Certificate Check</text>
  <text x="680" y="280" fill="#8b949e" font-size="10" text-anchor="middle">ssl_cert_check</text>
  <rect x="628" y="290" width="60" height="16" rx="8" fill="#3fb95022"/>
  <text x="658" y="301" fill="#3fb950" font-size="10" font-weight="600" text-anchor="middle">✓ done</text>
  <text x="696" y="301" fill="#8b949e" font-size="10">score: 2</text>

  <!-- Node: tech fingerprint -->
  <rect x="580" y="380" width="200" height="64" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="680" y="403" fill="#d29922" font-size="11" font-weight="600" text-anchor="middle">Tech Fingerprint</text>
  <text x="680" y="420" fill="#8b949e" font-size="10" text-anchor="middle">tech_fingerprint</text>
  <rect x="618" y="430" width="80" height="16" rx="8" fill="#d2992222"/>
  <text x="658" y="441" fill="#d29922" font-size="10" font-weight="600" text-anchor="middle">⚠ high risk</text>
  <text x="706" y="441" fill="#8b949e" font-size="10">score: 7</text>

  <!-- ── Layer 2: Exploitation ───────────────────────────────────────────── -->
  <text x="960" y="90" fill="#8b949e" font-size="11" text-anchor="middle">EXPLOITATION</text>

  <!-- Node: port scan -->
  <rect x="850" y="100" width="200" height="64" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="950" y="123" fill="#f85149" font-size="11" font-weight="600" text-anchor="middle">Port Scan</text>
  <text x="950" y="140" fill="#8b949e" font-size="10" text-anchor="middle">port_scan × 11 hosts</text>
  <rect x="888" y="150" width="80" height="16" rx="8" fill="#f8514922"/>
  <text x="928" y="161" fill="#f85149" font-size="10" font-weight="600" text-anchor="middle">✗ blocked</text>
  <text x="974" y="161" fill="#8b949e" font-size="10">score: 9</text>

  <!-- Node: vuln found -->
  <rect x="850" y="300" width="200" height="64" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="950" y="323" fill="#d29922" font-size="11" font-weight="600" text-anchor="middle">Exposed Admin Panel</text>
  <text x="950" y="340" fill="#8b949e" font-size="10" text-anchor="middle">nginx/1.24, no auth</text>
  <rect x="888" y="350" width="80" height="16" rx="8" fill="#d2992222"/>
  <text x="928" y="361" fill="#d29922" font-size="10" font-weight="600" text-anchor="middle">⚠ finding</text>
  <text x="974" y="361" fill="#8b949e" font-size="10">score: 8</text>

  <!-- ── Edges ───────────────────────────────────────────────────────────── -->
  <!-- subdomain -> http probe -->
  <line x1="520" y1="132" x2="578" y2="132" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- subdomain -> ssl check -->
  <path d="M 520 148 Q 548 148 548 272 L 578 272" stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <!-- subdomain -> tech fp -->
  <path d="M 520 148 Q 548 148 548 412 L 578 412" stroke="#d29922" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- http probe -> port scan -->
  <line x1="780" y1="132" x2="848" y2="132" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <!-- tech fp -> vuln found -->
  <path d="M 780 412 Q 814 412 814 332 L 848 332" stroke="#d29922" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- http probe -> vuln found -->
  <path d="M 780 148 Q 814 148 814 332 L 848 332" stroke="#d29922" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ── Legend ─────────────────────────────────────────────────────────── -->
  <rect x="252" y="680" width="500" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="268" y="700" fill="#8b949e" font-size="11" font-weight="600">Risk Score Legend</text>
  <rect x="268" y="710" width="12" height="12" rx="2" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="286" y="721" fill="#8b949e" font-size="11">Low (1–3)</text>
  <rect x="358" y="710" width="12" height="12" rx="2" fill="none" stroke="#d29922" stroke-width="2"/>
  <text x="376" y="721" fill="#8b949e" font-size="11">Medium / High (4–7)</text>
  <rect x="508" y="710" width="12" height="12" rx="2" fill="none" stroke="#f85149" stroke-width="2"/>
  <text x="526" y="721" fill="#8b949e" font-size="11">Critical (8–10)</text>

  <!-- Overall risk score -->
  <rect x="900" y="680" width="348" height="60" rx="6" fill="#f8514922" stroke="#f85149" stroke-width="1"/>
  <text x="916" y="704" fill="#f85149" font-size="13" font-weight="600">Overall Risk Score</text>
  <text x="1200" y="726" fill="#f85149" font-size="28" font-weight="700" text-anchor="middle">8.2</text>
  <text x="916" y="726" fill="#8b949e" font-size="12">/ 10 — High — review before proceeding</text>
</svg>
