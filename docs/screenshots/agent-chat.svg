<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">

  <!-- App background -->
  <rect width="1280" height="800" fill="#0d1117"/>

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <rect width="220" height="800" fill="#161b22"/>
  <line x1="220" y1="0" x2="220" y2="800" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="32" fill="#58a6ff" font-size="17" font-weight="700">⚔ Kestrel</text>
  <text x="16" y="48" fill="#8b949e" font-size="10">Security Operations Platform</text>
  <line x1="0" y1="56" x2="220" y2="56" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="84" fill="#e6edf3" font-size="13">⬡  Dashboard</text>
  <text x="16" y="114" fill="#e6edf3" font-size="13">📁 Projects</text>
  <!-- Agent (active) -->
  <rect x="0" y="124" width="220" height="32" fill="#21262d"/>
  <rect x="0" y="124" width="3" height="32" fill="#58a6ff"/>
  <text x="16" y="144" fill="#58a6ff" font-size="13">🤖 Agent</text>
  <text x="16" y="166" fill="#e6edf3" font-size="13">🎯 Skills</text>
  <text x="16" y="192" fill="#e6edf3" font-size="13">🧰 Tools Catalog</text>
  <text x="16" y="218" fill="#e6edf3" font-size="13">🗂  Sessions</text>
  <text x="16" y="244" fill="#e6edf3" font-size="13">💬 Conversations</text>
  <text x="16" y="270" fill="#e6edf3" font-size="13">✋ Approvals</text>
  <text x="16" y="296" fill="#e6edf3" font-size="13">📦 Assets</text>
  <text x="16" y="322" fill="#e6edf3" font-size="13">🛡  Vulnerabilities</text>
  <text x="16" y="348" fill="#e6edf3" font-size="13">📋 Audit Logs</text>
  <line x1="0" y1="752" x2="220" y2="752" stroke="#30363d" stroke-width="1"/>
  <text x="16" y="770" fill="#8b949e" font-size="12">admin</text>

  <!-- ── Main layout ────────────────────────────────────────────────────── -->
  <!-- Page title + controls -->
  <text x="244" y="42" fill="#e6edf3" font-size="20" font-weight="700">Agent</text>
  <!-- Project selector -->
  <rect x="920" y="20" width="180" height="30" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="932" y="39" fill="#8b949e" font-size="12">📁 Project: recon-alpha</text>
  <!-- Mode selector -->
  <rect x="1110" y="20" width="150" height="30" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="1122" y="39" fill="#8b949e" font-size="12">🤖 plan-execute</text>

  <!-- ── Chat area ──────────────────────────────────────────────────────── -->
  <rect x="236" y="60" width="810" height="680" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- User message 1 -->
  <rect x="490" y="80" width="540" height="52" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="506" y="100" fill="#8b949e" font-size="11">You</text>
  <text x="506" y="120" fill="#e6edf3" font-size="13">Enumerate subdomains for target.example.com and check HTTP services</text>

  <!-- Assistant response 1 -->
  <rect x="252" y="148" width="560" height="110" rx="6" fill="#161b22" stroke="#58a6ff33" stroke-width="1"/>
  <text x="268" y="168" fill="#58a6ff" font-size="11">Kestrel</text>
  <text x="268" y="188" fill="#e6edf3" font-size="13">Starting subdomain enumeration for target.example.com...</text>
  <!-- Tool call chip -->
  <rect x="268" y="198" width="240" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <rect x="268" y="198" width="4" height="28" rx="2" fill="#58a6ff"/>
  <text x="282" y="210" fill="#58a6ff" font-size="11">🔧 subdomain_enum</text>
  <text x="282" y="222" fill="#8b949e" font-size="10">domain: "target.example.com"</text>
  <!-- Tool result -->
  <rect x="268" y="234" width="300" height="18" rx="3" fill="#3fb95022"/>
  <text x="278" y="246" fill="#3fb950" font-size="11">✓ Found 14 subdomains  (0.8s)</text>

  <!-- Tool call 2 -->
  <rect x="252" y="274" width="560" height="80" rx="6" fill="#161b22" stroke="#58a6ff33" stroke-width="1"/>
  <text x="268" y="294" fill="#58a6ff" font-size="11">Kestrel</text>
  <rect x="268" y="302" width="260" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <rect x="268" y="302" width="4" height="28" rx="2" fill="#58a6ff"/>
  <text x="282" y="314" fill="#58a6ff" font-size="11">🔧 http_probe</text>
  <text x="282" y="326" fill="#8b949e" font-size="10">targets: ["api.target.example.com", "+13 more"]</text>
  <rect x="268" y="338" width="340" height="18" rx="3" fill="#3fb95022"/>
  <text x="278" y="350" fill="#3fb950" font-size="11">✓ 11 services alive, 3 redirect chains  (2.3s)</text>

  <!-- HITL approval block -->
  <rect x="252" y="370" width="560" height="96" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
  <text x="268" y="392" fill="#d29922" font-size="12" font-weight="600">✋ Approval Required</text>
  <text x="268" y="412" fill="#e6edf3" font-size="13">Run port_scan on 11 live hosts?  (analyst role — require_approval mode)</text>
  <text x="268" y="432" fill="#8b949e" font-size="12">Tool: port_scan   Targets: 11 hosts   Est. time: ~30s</text>
  <!-- Approve / Reject buttons -->
  <rect x="268" y="444" width="88" height="28" rx="6" fill="#3fb950" stroke="#3fb950" stroke-width="1"/>
  <text x="312" y="462" fill="#0d1117" font-size="13" font-weight="600" text-anchor="middle">✓ Approve</text>
  <rect x="366" y="444" width="80" height="28" rx="6" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="406" y="462" fill="#f85149" font-size="13" text-anchor="middle">✗ Reject</text>

  <!-- Final summary message -->
  <rect x="252" y="482" width="560" height="110" rx="6" fill="#161b22" stroke="#58a6ff33" stroke-width="1"/>
  <text x="268" y="502" fill="#58a6ff" font-size="11">Kestrel</text>
  <text x="268" y="520" fill="#e6edf3" font-size="13">Reconnaissance complete. Summary:</text>
  <text x="268" y="540" fill="#8b949e" font-size="12">• 14 subdomains discovered via CT logs</text>
  <text x="268" y="558" fill="#8b949e" font-size="12">• 11 HTTP/HTTPS services probed — 9 returning 200, 2 redirect</text>
  <text x="268" y="576" fill="#8b949e" font-size="12">• Interesting: admin.target.example.com (nginx/1.24, no auth header)</text>

  <!-- Input bar -->
  <rect x="252" y="710" width="780" height="20" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="268" y="724" fill="#8b949e" font-size="12">Send a message or /command...</text>
  <rect x="982" y="706" width="28" height="28" rx="6" fill="#58a6ff"/>
  <text x="996" y="724" fill="#0d1117" font-size="16" text-anchor="middle">↑</text>

  <!-- ── Right panel (run info) ──────────────────────────────────────────── -->
  <rect x="1058" y="60" width="206" height="680" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="1074" y="84" fill="#e6edf3" font-size="13" font-weight="600">Run Info</text>
  <line x1="1058" y1="92" x2="1264" y2="92" stroke="#30363d" stroke-width="1"/>
  <text x="1074" y="112" fill="#8b949e" font-size="11">Mode</text>
  <text x="1074" y="128" fill="#e6edf3" font-size="12">plan-execute</text>
  <text x="1074" y="150" fill="#8b949e" font-size="11">Status</text>
  <rect x="1074" y="156" width="64" height="18" rx="9" fill="#d2992222"/>
  <text x="1106" y="168" fill="#d29922" font-size="11" font-weight="600" text-anchor="middle">waiting</text>
  <text x="1074" y="192" fill="#8b949e" font-size="11">Steps</text>
  <text x="1074" y="208" fill="#e6edf3" font-size="12">3 / 4</text>
  <text x="1074" y="230" fill="#8b949e" font-size="11">Tokens used</text>
  <text x="1074" y="246" fill="#e6edf3" font-size="12">2,847</text>
  <text x="1074" y="268" fill="#8b949e" font-size="11">Elapsed</text>
  <text x="1074" y="284" fill="#e6edf3" font-size="12">00:03:12</text>
  <line x1="1058" y1="300" x2="1264" y2="300" stroke="#30363d" stroke-width="1"/>
  <text x="1074" y="322" fill="#e6edf3" font-size="13" font-weight="600">Tools Run</text>
  <!-- Tool history chips -->
  <rect x="1074" y="332" width="172" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <rect x="1074" y="332" width="4" height="22" rx="1" fill="#3fb950"/>
  <text x="1086" y="347" fill="#3fb950" font-size="11">✓ subdomain_enum</text>
  <rect x="1074" y="362" width="172" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <rect x="1074" y="362" width="4" height="22" rx="1" fill="#3fb950"/>
  <text x="1086" y="377" fill="#3fb950" font-size="11">✓ http_probe</text>
  <rect x="1074" y="392" width="172" height="22" rx="4" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <rect x="1074" y="392" width="4" height="22" rx="1" fill="#d29922"/>
  <text x="1086" y="407" fill="#d29922" font-size="11">⏸ port_scan (pending)</text>
</svg>
