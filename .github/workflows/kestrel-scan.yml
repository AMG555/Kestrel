name: Kestrel Security Scan & SARIF Export

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      fail_on:
        description: 'Vulnerability threshold to fail CI (critical, high, medium, low)'
        required: false
        default: 'high'

jobs:
  security-scan:
    name: Kestrel Agentic Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Build Kestrel binary
        run: go build -o kestrel ./cmd/server
        env:
          CGO_ENABLED: "1"

      - name: Run Kestrel SARIF scan export
        run: |
          FAIL_LEVEL="${{ github.event.inputs.fail_on || 'high' }}"
          ./kestrel -export-sarif -sarif-seed-fixture -sarif-out kestrel-findings.sarif -sarif-fail-on "$FAIL_LEVEL"
        id: kestrel_scan

      - name: Upload SARIF report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: kestrel-findings.sarif
          category: kestrel-secops

      - name: Enforce quality gate
        if: steps.kestrel_scan.outcome == 'failure'
        run: |
          echo "::error::Kestrel detected security findings meeting or exceeding threshold (${{ github.event.inputs.fail_on || 'high' }}). Check Security tab for details."
          exit 2
