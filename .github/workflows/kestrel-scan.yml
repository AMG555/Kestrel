name: Kestrel Security Scan & SARIF Export

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      fail_on:
        description: 'Vulnerability threshold to fail CI (critical, high, medium, low)'
        required: false
        default: 'critical'

jobs:
  security-scan:
    name: Kestrel Agentic Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Kestrel Action
        uses: ./
        with:
          fail_on: ${{ github.event.inputs.fail_on || 'none' }}
          seed_fixture: 'true'
          upload_sarif: 'true'
          sarif_file: 'kestrel-findings.sarif'
