# golangci-lint configuration for Kestrel
# Run: golangci-lint run ./...
# Install: https://golangci-lint.run/usage/install/

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck        # check that errors are handled
    - gosimple        # simplify code
    - govet           # go vet equivalent
    - ineffassign     # detect unused assignments
    - staticcheck     # staticcheck suite
    - unused          # detect unused code
    - gofmt           # formatting
    - goimports       # import ordering
    - misspell        # common spelling mistakes
    - godot           # comment punctuation
    - noctx           # http.NewRequest without context
    - bodyclose       # http response body close check
    - gocritic        # opinionated suggestions
    - revive          # fast, configurable linter

linters-settings:
  errcheck:
    # Don't require error checks on fmt.Print* calls
    exclude-functions:
      - fmt.Print
      - fmt.Println
      - fmt.Printf
      - (*go.uber.org/zap.Logger).Sync

  govet:
    disable:
      - fieldalignment  # struct field alignment: useful but noisy
      - shadow          # standard idiomatic Go err re-declaration

  staticcheck:
    checks: ["all", "-SA1019"]

  misspell:
    locale: US

  godot:
    # Require period at end of comments (package-level and exported)
    scope: toplevel
    exclude:
      - "^TODO"
      - "^FIXME"
      - "^nolint"

  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"

  gocritic:
    enabled-tags:
      - diagnostic
      - style

issues:
  # Don't report issues in test files for style or non-critical checks
  exclude-rules:
    - path: _test\.go
      linters:
        - godot
        - gocritic
        - errcheck
        - staticcheck
        - gosimple
        - govet
        - revive
        - gofmt
        - goimports
    # CGO/SQLite stubs produce errors we can't fix
    - path: internal/database/
      linters:
        - gocritic
  max-issues-per-linter: 50
  max-same-issues: 10
