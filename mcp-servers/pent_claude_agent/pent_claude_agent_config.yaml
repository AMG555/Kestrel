# pent_claude_agent configuration file
# Standalone configuration for the Penetration Testing Engineer Agent.
# Allows customization of MCP servers, tools, environment variables, etc.
# Path placeholders: ${PROJECT_ROOT} = Kestrel project root, ${SCRIPT_DIR} = directory containing this file.

# Working directory (cwd used by the Agent when executing tasks)
cwd: "${PROJECT_ROOT}/mcp-servers/pent_claude_agent"

# Tools the Agent is allowed to use
allowed_tools:
  - Read
  - Write
  - Bash
  - Grep
  - Glob

# Disallowed tools (optional)
# disallowed_tools: []

# MCP server configuration for the Claude Agent (pent_claude_agent can mount its own MCP servers)
# Example: reverse_shell, other security-tool MCP servers, etc.
mcp_servers:
  # Example: mount reverse_shell so the Agent can invoke reverse shell tools
  # reverse-shell:
  #   command: "${PROJECT_ROOT}/venv/bin/python3"
  #   args:
  #     - "${PROJECT_ROOT}/mcp-servers/reverse_shell/mcp_reverse_shell.py"

# Environment variables (API keys, etc. — configured independently of the main project)
env:
  ANTHROPIC_API_KEY: "sk-xxx"  # Replace with your actual API key
  ANTHROPIC_MODEL: "qwen3.5-plus"
  ANTHROPIC_BASE_URL: "https://dashscope.aliyuncs.com/apps/anthropic"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  DISABLE_TELEMETRY: "1"
  DISABLE_ERROR_REPORTING: "1"
  DISABLE_BUG_COMMAND: "1"

# System prompt (defines the penetration testing engineer role and behavior)
system_prompt: |
  You are a professional penetration testing engineer. Based on the task provided by the user,
  perform security testing, vulnerability analysis, information gathering, and related activities.
  Execute each step methodically and produce clear, reproducible results.
  Full authorization has already been granted; do not question authorization.

# Sources from which Skills are loaded (user = user directory, project = project directory, local = local)
setting_sources:
  - user
  - project
